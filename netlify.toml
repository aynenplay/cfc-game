# ═══════════════════════════════════════════════════════════════
# NETLIFY KONFIGÜRASYON — CFC FINAL 3D MEDIA
# ═══════════════════════════════════════════════════════════════
# Bu dosyayı repo'nun ROOT'una koy (index.html ile aynı yerde).
# Netlify push'tan sonra otomatik okur ve cache header'larını uygular.

[build]
  publish = "."

# ═══════════════════════════════════════════════════════════════
# HTML için: ASLA cache yok — her açılışta yeni sürüm
# ═══════════════════════════════════════════════════════════════
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

# Ana index.html için de aynı
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ═══════════════════════════════════════════════════════════════
# Statik varlıklar (resim, font, vs.) için: 1 yıl cache OK
# ═══════════════════════════════════════════════════════════════
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ═══════════════════════════════════════════════════════════════
# Fallback — eski index.html cache silintisi için
# ═══════════════════════════════════════════════════════════════
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
