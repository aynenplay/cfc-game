*{box-sizing:border-box}
html,body{margin:0;background:#05070a;color:#fff;-webkit-font-smoothing:antialiased;font-family:'Barlow',sans-serif}
.kp-arka{position:fixed;inset:-80px;z-index:0;background:var(--kp-resim) center/cover;filter:blur(56px) saturate(1.2);opacity:.18}
.kp-arka::after{content:'';position:absolute;inset:0;background:radial-gradient(110% 60% at 50% 20%,rgba(130,210,40,.12),transparent 70%),linear-gradient(transparent 40%,#05070a 95%)}
main{position:relative;z-index:1;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
@keyframes aclGel{to{opacity:1;transform:none}}
@keyframes aclIsilti{0%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(560%) skewX(-20deg)}}
@keyframes kpBelir{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kp-hero{display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top,0px)}
.kp-poster{position:relative;width:min(100vw,56vh,600px);aspect-ratio:1;overflow:hidden;opacity:0;animation:aclGel 1.3s ease-out .1s forwards;
  -webkit-mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(transparent,#000 6%,#000 72%,transparent 99%);-webkit-mask-composite:source-in;
  mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(transparent,#000 6%,#000 72%,transparent 99%);mask-composite:intersect}
.acl-resim{position:absolute;inset:0;background:var(--kp-resim) center/cover;transform:scale(1.14);animation:aclGel 4.6s cubic-bezier(.25,.6,.35,1) .1s forwards}
.acl-isilti{position:absolute;top:-20%;bottom:-20%;width:30%;left:-45%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(235,255,180,0) 10%,rgba(235,255,180,.45) 50%,rgba(235,255,180,0) 90%,transparent);animation:aclIsilti 1.3s ease-in-out 1.6s}
.kp-metin{margin-top:calc(min(100vw,56vh,600px) * -.12);padding:0 16px;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;animation:kpBelir .7s ease-out .8s forwards}
.kp-ust{margin:0 0 8px;font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.6)}
.kp-slogan{margin:0;max-width:640px;font:400 clamp(21px,5.7vw,34px)/1.18 'Russo One',sans-serif;text-transform:uppercase;letter-spacing:.4px;color:#f4f6f0;text-shadow:0 1px 0 #c3c9bb,0 2px 0 #868c7f,0 3px 1px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.55)}
.kp-slogan b{text-shadow:0 1px 0 #8fc22a,0 2px 0 #557b12,0 3px 1px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.55)}
.kp-slogan b,.kp-kart h3 b{color:var(--yesil);font-weight:inherit}
.kp-rozetler{--kr:3.3;margin-top:22px;display:flex;justify-content:center;gap:10px;width:100%;max-width:calc(124px * var(--kr) + 10px)}
.kp-rozetler a{flex:1 1 0;min-width:0;aspect-ratio:var(--kr);display:flex;align-items:center;justify-content:center;background:#000;border:1px solid #a6a6a6;border-radius:10px;transition:transform .15s}
.kp-rozetler a:active{transform:scale(.96)}
.kp-rozetler a{cursor:pointer}
.kp-yakinda{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);z-index:5;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:11px 22px;border-radius:999px;background:rgba(8,11,8,.92);border:1px solid rgba(180,242,60,.55);box-shadow:0 8px 24px rgba(0,0,0,.5);font:800 15px 'Barlow Condensed',sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--yesil);transition:opacity .2s,transform .2s}
.kp-yakinda.acik{opacity:1;transform:translate(-50%,0)}
.kp-rozetler img{display:block;height:auto}
.kp-ekranlar{margin-top:38px;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 calc(50vw - 125px) 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.kp-ekranlar::-webkit-scrollbar{display:none}
.kp-kart{flex:0 0 250px;margin:0;scroll-snap-align:center;text-align:center}
.kp-kart img{display:block;width:100%;height:auto}
.kp-kart h3{margin:12px 0 6px;font:900 21px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.3px}
.kp-kart p{margin:0;padding:0 6px;font:500 13px/1.4 'Barlow',sans-serif;color:rgba(255,255,255,.62)}
.kp-alt{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:10px}
.kp-imza{display:flex;flex-direction:column;align-items:center;gap:2px}
.kp-imza small{font:600 8px 'Barlow',sans-serif;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.35)}
.kp-imza b{font:800 12px 'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.7)}
.kp-imza sup{font-size:7px}
.kp-yasal{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;padding:0 16px}
.kp-yasal a{font:600 11px 'Barlow',sans-serif;color:rgba(255,255,255,.4);text-decoration:none}
.kp-yasal a:hover{color:rgba(255,255,255,.75)}
@media (min-width:720px){
  .kp-rozetler{gap:14px;max-width:calc(124px * var(--kr) + 14px)}
  .kp-rozetler a{border-radius:13px}
}
@media (min-width:1100px){
  .kp-ekranlar{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 28px;max-width:1160px;margin:54px auto 0;padding:0 24px;overflow:visible}
  .kp-kart{flex:none}
}
</style>
</head>
<body>
<div class="kp-arka"></div>
<main>
  <section class="kp-hero">
    <div class="kp-poster"><div class="acl-resim"><div class="acl-isilti"></div></div></div>
    <div class="kp-metin">
      <p class="kp-ust" id="kpUst"></p>
      <h1 class="kp-slogan" id="kpSlogan"></h1>
      <div class="kp-rozetler">
        <a id="kpGoogle" target="_blank" rel="noopener"><img id="kpGoogleImg" alt="Google Play"></a>
        <a id="kpApple" target="_blank" rel="noopener"><img id="kpAppleImg" alt="App Store"></a>
      </div>
