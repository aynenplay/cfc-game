<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0e; --panel:#14171d; --panel2:#1a1e26; --line:#262b34;
    --txt:#e7eaf0; --dim:#8a93a3; --accent:#2ec36b; --accent2:#1f9e54;
    --red:#e23b5a; --gold:#ffd54f; --goldln:rgba(255,213,79,.28); --blue:#42a5f5;
    --carbon:repeating-linear-gradient(45deg,#15171c 0,#15171c 2px,#101216 2px,#101216 4px);
    --disp:'Barlow Condensed',system-ui,sans-serif;
    --body:'Barlow',system-ui,sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--body); font-size:14px; line-height:1.4; color:var(--txt);
    background:var(--bg) radial-gradient(1200px 600px at 80% -10%, #16191f 0, transparent 60%); }
  button{ font-family:var(--disp); cursor:pointer; border:none; border-radius:9px; letter-spacing:.4px; }
  input,select,textarea{ font-family:var(--body); background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:9px; padding:8px 11px; outline:none; }
  input:focus,select:focus,textarea:focus{ border-color:var(--goldln); }
  textarea{ width:100%; min-height:96px; resize:vertical; font-family:var(--mono); font-size:12px; }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:#2a2f3a; border-radius:6px; }

  .carbon{ background-image:var(--carbon); border:1px solid var(--goldln); border-radius:12px; }
  .disp{ font-family:var(--disp); }

  /* Giriş */
  #login{ max-width:360px; margin:13vh auto; padding:30px 26px 26px; }
  #login .logo{ width:74px; height:74px; border-radius:16px; display:block; margin:0 auto 14px; box-shadow:0 6px 24px rgba(210,35,47,.35); }
  #login h1{ font-family:var(--disp); font-weight:900; font-size:26px; text-align:center; margin:0; letter-spacing:.5px; }
  #login h1 span{ color:var(--gold); }
  #login p{ text-align:center; color:var(--dim); font-size:13px; margin:2px 0 20px; }
  #login input{ width:100%; margin-bottom:11px; }
  #login button{ width:100%; padding:12px; font-weight:800; font-size:16px; color:#06210f;
    background:linear-gradient(180deg,var(--accent),var(--accent2)); border:1px solid #36d27c; }
  #login button:hover{ filter:brightness(1.06); }
  #loginErr{ color:var(--red); font-size:13px; min-height:18px; margin-top:8px; text-align:center; }

  /* Uygulama */
  #app{ display:none; }
  #app.show{ display:grid; grid-template-columns:236px 1fr; height:100vh; }
  #side{ background-image:var(--carbon); border-right:1px solid var(--goldln); overflow:auto; padding:12px 10px; }
  #brand{ display:flex; align-items:center; gap:9px; padding:6px 8px 14px; }
  #brand img{ width:30px; height:30px; border-radius:8px; }
  #brand b{ font-family:var(--disp); font-weight:900; font-size:17px; letter-spacing:.5px; }
  #brand b span{ color:var(--gold); }
  #nav{ margin-bottom:6px; }
  .cathead{ display:flex; align-items:center; width:100%; text-align:left; background:transparent; color:var(--gold);
    font-family:var(--disp); font-weight:800; font-size:13px; letter-spacing:.6px; text-transform:uppercase;
    padding:9px 10px; border-radius:8px; border:1px solid transparent; transition:.12s; cursor:pointer; }
  .cathead:hover{ background:#1b1f27; }
  .cathead .chev{ margin-left:auto; transition:transform .15s; opacity:.65; }
  .cat.open > .cathead{ color:#fff; }
  .cat.open > .cathead .chev{ transform:rotate(90deg); opacity:1; }
  .subwrap{ display:none; padding:2px 0 8px 8px; }
  .cat.open > .subwrap{ display:block; }
  .sub{ display:block; width:100%; text-align:left; background:transparent; color:var(--dim);
    font-family:var(--body); font-size:13.5px; font-weight:600; padding:7px 10px; border-radius:8px; margin-bottom:2px;
    border:1px solid transparent; border-left:2px solid #2a2f3a; transition:.12s; }
  .sub:hover{ background:#1b1f27; color:var(--txt); border-left-color:var(--goldln); }
  .sub.active{ color:#fff; background:linear-gradient(180deg,rgba(46,195,107,.26),rgba(31,158,84,.14)); border-color:#2ec36b; border-left-color:#2ec36b; }
  .soon{ color:#5c6470; font-size:12px; font-style:italic; padding:5px 10px 5px 12px; }
  #logoutBtn{ display:block; width:100%; text-align:left; background:transparent; color:var(--red);
    font-weight:700; padding:9px 11px; margin-top:14px; border:1px solid transparent; border-radius:9px; }
  #logoutBtn:hover{ background:rgba(226,59,90,.1); }

  #main{ overflow:auto; padding:16px 18px; }

  /* başlık kutusu */
  .titlebox{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:11px 14px; margin-bottom:14px;
    background-image:var(--carbon); border:1px solid var(--goldln); border-radius:12px; }
  .titlebox h2{ font-family:var(--disp); font-weight:900; font-size:20px; margin:0; letter-spacing:.5px; }
  .titlebox .cnt{ color:var(--gold); font-family:var(--disp); font-weight:700; font-size:13px; }
  .titlebox .sp{ flex:1; }
  .titlebox select,.titlebox input{ height:36px; }
  .titlebox input{ width:170px; }

  .btn{ background:var(--panel2); color:var(--txt); border:1px solid var(--line); padding:8px 13px; font-weight:700; font-size:14px; transition:.12s; }
  .btn:hover{ border-color:var(--goldln); }
  .btn.green{ background:linear-gradient(180deg,var(--accent),var(--accent2)); color:#06210f; border:1px solid #36d27c; }
  .btn.green:hover{ filter:brightness(1.06); }
  .btn.gold{ background:transparent; color:var(--gold); border:1px solid var(--goldln); }
  .btn.red{ background:transparent; color:var(--red); border:1px solid rgba(226,59,90,.5); }

  .tablewrap{ background-image:var(--carbon); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .scroll{ overflow:auto; max-height:calc(100vh - 188px); }
  table{ border-collapse:collapse; width:100%; }
  th,td{ padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); border-right:1px solid #1e222b;
    font-size:12.5px; max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  th{ position:sticky; top:0; background:#161a21; color:var(--gold); font-family:var(--disp); font-weight:700; letter-spacing:.4px;
    font-size:12px; text-transform:uppercase; border-bottom:1px solid var(--goldln); }
  td{ font-family:var(--mono); color:#cfd5df; }
  tbody tr:hover td{ background:rgba(46,195,107,.05); }
  td.act{ white-space:nowrap; font-family:var(--body); }
  td .mini{ padding:4px 10px; font-size:12px; margin-right:5px; background:var(--panel2); border:1px solid var(--line); color:var(--txt); font-weight:700; }
  td .mini.red{ color:var(--red); border-color:rgba(226,59,90,.45); }
  td .mini:hover{ border-color:var(--goldln); }

  .page{ display:flex; gap:10px; align-items:center; margin-top:14px; }
  .page .cnt{ color:var(--dim); font-family:var(--disp); font-weight:700; }
  .msg{ color:var(--dim); padding:26px 6px; }
  .err{ color:var(--red); }
  .fadein{ animation:fu .22s ease both; } @keyframes fu{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* Özet (dashboard) */
  #dashBtn{ display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:transparent; color:var(--dim);
    font-family:var(--disp); font-size:14px; font-weight:700; padding:9px 11px; border-radius:9px; margin-bottom:8px; border:1px solid transparent; transition:.12s; }
  #dashBtn:hover{ background:#1b1f27; color:var(--txt); }
  #dashBtn.active{ color:#fff; background:linear-gradient(180deg,rgba(46,195,107,.28),rgba(31,158,84,.16)); border-color:#2ec36b; }
  .cardgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(184px,1fr)); gap:12px; }
  .card{ text-align:left; background-image:var(--carbon); border:1px solid var(--goldln); border-radius:12px; padding:16px; color:var(--txt); cursor:pointer; transition:.14s; }
  .card:hover{ border-color:var(--accent); transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.35); }
  .card .num{ font-family:var(--disp); font-weight:900; font-size:30px; color:var(--gold); line-height:1; }
  .card .lbl{ color:var(--dim); font-family:var(--disp); font-weight:600; font-size:14px; margin-top:7px; letter-spacing:.4px; }

  /* Geri bildirim */
  .fbhead{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:24px 0 12px; }
  .fbhead h2{ font-family:var(--disp); font-weight:900; font-size:19px; margin:0; letter-spacing:.5px; }
  .fbhead .sp{ flex:1; }
  .chip{ background:var(--panel2); color:var(--dim); border:1px solid var(--line); border-radius:20px; padding:5px 13px;
    font-family:var(--disp); font-weight:700; font-size:13px; cursor:pointer; transition:.12s; }
  .chip:hover{ color:var(--txt); border-color:var(--goldln); }
  .chip.active{ color:#fff; background:linear-gradient(180deg,rgba(46,195,107,.28),rgba(31,158,84,.16)); border-color:#2ec36b; }
  .fblist{ display:flex; flex-direction:column; gap:10px; }
  .fbitem{ background-image:var(--carbon); border:1px solid var(--line); border-left-width:4px; border-radius:10px; padding:13px 15px; }
  .fbitem .top{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .fbbadge{ font-family:var(--disp); font-weight:800; font-size:11px; letter-spacing:.5px; text-transform:uppercase; padding:3px 9px; border-radius:6px; }
  .fbstat{ font-family:var(--disp); font-weight:700; font-size:11px; color:var(--dim); }
  .fbstat.yeni{ color:var(--accent); }
  .fbitem .when{ margin-left:auto; color:#5c6470; font-size:11px; font-family:var(--mono); }
  .fbitem .msg{ color:var(--txt); font-size:14px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .fbitem .foot{ display:flex; align-items:center; gap:8px; margin-top:10px; }
  .fbitem .who{ color:var(--dim); font-size:12px; }
  .fbitem .acts{ margin-left:auto; display:flex; gap:6px; }
  .fbitem .acts .btn{ padding:5px 11px; font-size:12.5px; }
  .fbempty{ color:var(--dim); padding:16px 4px; }
  .fbsetup{ background-image:var(--carbon); border:1px solid var(--goldln); border-radius:10px; padding:16px; color:var(--dim); line-height:1.6; }
  .fbsetup b{ color:var(--gold); font-family:var(--disp); }
  .fbsetup code{ font-family:var(--mono); color:var(--txt); background:#1b1f27; padding:1px 6px; border-radius:5px; }

  /* Modal */
  #modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.62); align-items:flex-start; justify-content:center; overflow:auto; padding:34px 16px; z-index:50; }
  #modal .box{ width:580px; max-width:100%; padding:22px; }

  const r = await fetch(GATEWAY, {

function renderFeedback(){
  const area = $('fbArea'); if(!area) return;
  const counts = { all:FB_DATA.length, sikayet:0, istek:0, talep:0 };
  FB_DATA.forEach(f=>{ if(counts[f.type]!==undefined) counts[f.type]++; });
  const chip = (k,lbl)=>`<button class="chip ${FB_FILTER===k?'active':''}" data-f="${k}">${lbl} (${counts[k]||0})</button>`;
  const items = FB_DATA.filter(f => FB_FILTER==='all' || f.type===FB_FILTER);
  const head = `<div class="fbhead"><h2>Geri Bildirimler</h2><div class="sp"></div>
    ${chip('all','Tümü')}${chip('sikayet','Şikayet')}${chip('istek','İstek')}${chip('talep','Talep')}</div>`;
  const list = items.length
    ? `<div class="fblist">${items.map(fbItemHtml).join('')}</div>`
    : '<div class="fbempty">Bu kategoride geri bildirim yok.</div>';
  area.innerHTML = head + list;
  area.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ FB_FILTER=c.dataset.f; renderFeedback(); });
  area.querySelectorAll('[data-fbs]').forEach(b=>b.onclick=()=>fbStatus(b.dataset.id, b.dataset.fbs));
  area.querySelectorAll('[data-fbd]').forEach(b=>b.onclick=()=>fbDelete(b.dataset.fbd));
}

async function fbStatus(id, status){

}
async function fbDelete(id){

  try { await api('delete', { table:'feedback', pk:{ id } }); loadFeedback(); }

}

function buildNav() {

    const tabs = c.tables.filter(t => t==='__users__' || META[t]);
    const subs = tabs.length
      ? tabs.map(t => `<button class="sub" data-t="${t}">${t==='__users__'?'Kullanıcılar':tableLabel(t)}</button>`).join('')

async function openTable(t) {
  CUR=t; STATE={ offset:0, limit:50, search:'', searchCol:'' };
  $('dashBtn').classList.remove('active');
  $('nav').querySelectorAll('.sub').forEach(b => b.classList.toggle('active', b.dataset.t===t));

  await loadRows();
}
async function loadRows() {
  $('main').innerHTML='<div class="msg">Yükleniyor…</div>';
  try {
    const d = await api('list', { table:CUR, limit:STATE.limit, offset:STATE.offset,
      search:STATE.search||undefined, searchCol:STATE.searchCol||undefined });
    renderGrid(d.rows||[], d.count||0);
  } catch(e) { $('main').innerHTML = `<div class="msg err">${e.message}</div>`; }
}
const fmtCell = (v) => (v===null||v===undefined) ? '' : (typeof v==='object' ? JSON.stringify(v) : String(v));

function renderGrid(rows, count) {
  const cols = (META[CUR].columns||[]).map(c=>c.name);
  const textCols = (META[CUR].columns||[]).filter(c=>['text','character varying','uuid'].includes(c.type)).map(c=>c.name);
  if (!STATE.searchCol && textCols.length) STATE.searchCol = textCols[0];

  const head = `
    <div class="titlebox fadein">
      <button class="backbtn" id="backBtn">‹ Geri</button>
      <h2>${tableLabel(CUR)}</h2>
      <span class="cnt">${count} kayıt</span>
      <div class="sp"></div>
      <select id="scol">${textCols.map(c=>`<option value="${c}" ${c===STATE.searchCol?'selected':''}>${colLabel(c)}</option>`).join('')}</select>
      <input id="sval" placeholder="ara…" value="${STATE.search.replace(/"/g,'&quot;')}">
      <button class="btn gold" id="sbtn">Ara</button>
      <button class="btn green" id="addBtn">+ Ekle</button>
    </div>`;

  const table = `
    <div class="tablewrap fadein"><div class="scroll">
    <table>
      <thead><tr>${cols.map(c=>`<th title="${c}">${colLabel(c)}</th>`).join('')}<th>İşlem</th></tr></thead>
      <tbody>
        ${rows.map((row,i)=>`<tr>
          ${cols.map(c=>`<td title="${fmtCell(row[c]).replace(/"/g,'&quot;')}">${fmtCell(row[c])}</td>`).join('')}
          <td class="act"><button class="mini" data-edit="${i}">Düzenle</button><button class="mini red" data-del="${i}">Sil</button></td>
        </tr>`).join('')}
      </tbody>
    </table></div></div>`;

  const totalPages = Math.max(1, Math.ceil(count/STATE.limit));
  const curPage = Math.floor(STATE.offset/STATE.limit)+1;
  const page = `
    <div class="page">
      <button class="btn" id="prev" ${STATE.offset<=0?'disabled':''}>‹ Önceki</button>
      <span class="cnt">${curPage} / ${totalPages}</span>
      <button class="btn" id="next" ${curPage>=totalPages?'disabled':''}>Sonraki ›</button>
    </div>`;

  $('main').innerHTML = head + table + (rows.length ? page : '<div class="msg">Kayıt yok.</div>');

  $('sbtn').onclick = () => { STATE.search=$('sval').value.trim(); STATE.searchCol=$('scol').value; STATE.offset=0; loadRows(); };
  $('sval').addEventListener('keydown', e => { if (e.key==='Enter') $('sbtn').click(); });
  $('addBtn').onclick = () => openEditor('add', {});
  const bk=$('backBtn'); if(bk) bk.onclick = openDash;
  const prev=$('prev'), next=$('next');
  if (prev) prev.onclick = () => { STATE.offset=Math.max(0,STATE.offset-STATE.limit); loadRows(); };
  if (next) next.onclick = () => { STATE.offset+=STATE.limit; loadRows(); };
  $('main').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEditor('edit', rows[+b.dataset.edit]));
  $('main').querySelectorAll('[data-del]').forEach(b => b.onclick = () => delRow(rows[+b.dataset.del]));
}

function pkObj(row, tbl) {
  const pk = META[tbl||CUR].pk||[]; const o={};
  (pk.length ? pk : Object.keys(row)).forEach(k => { if (k in row) o[k]=row[k]; });
  return o;
}

function openEditor(mode, row, tbl, after) {
  const T = tbl || CUR;
  EDIT={ table:T, mode, row, after:after||null };
  const pk = META[T].pk||[], cols = META[T].columns||[];
  $('modalTitle').innerHTML = (mode==='add'?'Yeni kayıt — ':'Düzenle — ') + `<span>${tableLabel(T)}</span>`;
  $('modalErr').textContent='';
  $('modalFields').innerHTML = cols.map(c => {
    const isPk = pk.includes(c.name);
    const ro = (mode==='edit' && isPk) ? 'readonly' : '';
    let val = (c.name in row) ? row[c.name] : null;
    const isJson = (c.type==='jsonb' || c.type==='json');
    const dv = (val===null||val===undefined) ? '' : (typeof val==='object' ? JSON.stringify(val,null,2) : String(val));
    const field = isJson
      ? `<textarea data-c="${c.name}" ${ro}>${dv.replace(/</g,'&lt;')}</textarea>`
      : `<input data-c="${c.name}" value="${dv.replace(/"/g,'&quot;')}" ${ro}>`;
    return `<div class="fld"><label>${colLabel(c.name)} <span class="ty">${c.name} · ${c.type}${isPk?' · PK':''}</span></label>${field}</div>`;
  }).join('');
  $('modal').style.display='flex';
}

function coerce(type, raw) {
  if (raw==='') return null;
  if (type==='jsonb'||type==='json') return JSON.parse(raw);
  if (type==='boolean') return raw==='true'||raw===true;
  if (['integer','bigint','smallint','numeric','double precision','real'].includes(type)) return Number(raw);
  return raw;
}

async function saveEditor() {
  $('modalErr').textContent='';
  const cols = META[EDIT.table].columns||[], pk = META[EDIT.table].pk||[], values={};
  try {
    $('modalFields').querySelectorAll('[data-c]').forEach(el => {
      const name=el.dataset.c, type=(cols.find(c=>c.name===name)||{}).type||'text';
      if (EDIT.mode==='edit' && pk.includes(name)) return;
      values[name]=coerce(type, el.value);
    });
  } catch(e) { $('modalErr').textContent='JSON hatası: '+e.message; return; }
  try {
    if (EDIT.mode==='add') await api('insert', { table:EDIT.table, values });
    else await api('update', { table:EDIT.table, pk:pkObj(EDIT.row, EDIT.table), values });
    $('modal').style.display='none'; if (EDIT.after) EDIT.after(); else loadRows();
  } catch(e) { $('modalErr').textContent = e.message; }
}

async function delRow(row) {
  if (!confirm('Bu kaydı silmek istediğine emin misin? Geri alınamaz.')) return;
  try { await api('delete', { table:CUR, pk:pkObj(row) }); loadRows(); }
  catch(e) { alert('Silinemedi: '+e.message); }
}

function uPlayerBits(up){
  if(!up) return null;
  const pj = up.player||{};
  const ovr = up.overall!=null?up.overall:(pj.overall!=null?pj.overall:'–');
  const pos = up.position||pj.pos||pj.position||'';
  const num = up.num!=null?up.num:(pj.num!=null?pj.num:'');
  const name = pj.name||up.name||'';
  const level = up.level!=null?up.level:'–';
  const xp = up.xp!=null?up.xp:null;
  const ab = up.abilities||pj.abilities||up.skills||pj.skills;
  const aCount = Array.isArray(ab)?ab.length:(ab&&typeof ab==='object'?Object.keys(ab).length:0);
  const eq = up.equipment||{};
  const eqCount = (eq&&typeof eq==='object')?Object.values(eq).filter(v=>v!=null&&v!=='').length:0;
  const tro = up.trophies; const tCount = Array.isArray(tro)?tro.length:0;
  return { ovr, pos, num, name, level, xp, aCount, eqCount, tCount };
}

  catch(e){ alert('Silinemedi: '+e.message); }
}

// Bağlamalar
$('loginBtn').onclick = doLogin;
$('pass').addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
$('logoutBtn').onclick = logout;
$('dashBtn').onclick = openDash;
$('modalCancel').onclick = () => { $('modal').style.display='none'; };
$('modalSave').onclick = saveEditor;
$('modal').addEventListener('click', e => { if (e.target.id==='modal') $('modal').style.display='none'; });

// İkonları tek base64'ten ata
['loginLogo','brandLogo','topLogo','bootLogo'].forEach(id=>{ const e=$(id); if(e) e.src=ICON; });

// Mobil çekmece
$('burger').onclick = () => document.body.classList.toggle('navopen');
$('overlay').onclick = () => document.body.classList.remove('navopen');

// Beni hatırla / oturumu sürdür (admin uygulaması — oyun verisi değil)
const SESS_KEY='csc_admin_sess';
function saveSess(d){ try{ localStorage.setItem(SESS_KEY, JSON.stringify({ access_token:d.access_token, refresh_token:d.refresh_token })); }catch(e){} }
function clearSess(){ try{ localStorage.removeItem(SESS_KEY); }catch(e){} }
async function refreshSession(rt){
  const r = await fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token', {
    method:'POST', headers:{ 'apikey':CFG.anon, 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token:rt })
  });
  const d = await r.json();
  if (!r.ok || !d.access_token) throw new Error('refresh failed');
  return d;
}
function showLogin(){ var b=$('boot'); if(b) b.style.display='none'; $('app').classList.remove('show'); $('login').style.display='block'; }
async function tryResume(){
  let sess=null; try{ sess=JSON.parse(localStorage.getItem(SESS_KEY)||'null'); }catch(e){}
  if(!sess || !sess.access_token){ showLogin(); return; }
  TOKEN = sess.access_token;
  try { META = (await api('meta')).meta || {}; }
  catch(e){
    if(!sess.refresh_token){ clearSess(); showLogin(); return; }
    try { const d=await refreshSession(sess.refresh_token); TOKEN=d.access_token; saveSess(d); META=(await api('meta')).meta || {}; }
    catch(e2){ clearSess(); showLogin(); return; }
  }
  var b=$('boot'); if(b) b.style.display='none';
  $('login').style.display='none'; $('app').classList.add('show');
  buildNav(); openDash();
}
tryResume();
</script>
