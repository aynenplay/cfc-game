const HUNI_PF = [['tum','Tümü'],['android','Android'],['ios','iOS'],['web','Web']];
const HUNI_KOL = [['acilis','Açılış'],['kayit','Kayıt'],['adim1','E-posta'],['sosyal','Google'],['adim2','Bilgi'],['adim3','Avatar'],['hesap','Hesap']];
// 799 — kayıt yöntemi: cihaz Google/Apple adımı attıysa o, yoksa e-posta (798 öncesi kayıtlar e-posta sayılır)
const HUNI_YM = [['tum','Tümü'],['eposta','E-posta'],['google','Google'],['apple','Apple']];
const HUNI_UC = { tum:'E-posta · şifre / Google', eposta:'E-posta · şifre', google:'Google hesabı', apple:'Apple hesabı' };
// 3. adım: e-posta/şifreyi geçen ya da Google/Apple ile devam eden cihaz (ikisini de yapan bir kez)
const huniUc=R=>R.reduce((t,x)=>t+(x.adim1y!=null?(Number(x.adim1y)||0):(Number(x.adim1)||0)+(Number(x.sosyal)||0)),0);
function huniAra(k){
  const bugun=uIstGun();
  if(k==='bugun') return [bugun,bugun];
  if(k==='ay') return [bugun.slice(0,8)+'01',bugun];
  if(k==='ozel'){
    if(!HUNI.bas){ HUNI.bas=uIstGun(Date.now()-6*86400000); HUNI.bit=bugun; }
    return HUNI.bas<=HUNI.bit?[HUNI.bas,HUNI.bit]:[HUNI.bit,HUNI.bas];
  }
  return null;
}
// Günlük satırlar en yeni günden geriye okunur; istenen ilk güne varınca durur (bas null: hepsi)
function huniYukle(bas){
  const V=HUNI.veri;
  if(V && (V.tam || (bas && V.bas<=bas))) return Promise.resolve(V);
  if(HUNI.yuk) return HUNI.yuk.then(()=>huniYukle(bas));
  const eski=rows=>rows.some(x=>String(x.gun).slice(0,10)<bas);
  HUNI.yuk=Promise.all([apiTum({ table:'admin_kayit_huni', orderBy:'k', orderDir:'desc', sayim:'yok' }, bas?eski:null),
                        apiTum({ table:'admin_kayit_huni_hata', orderBy:'k', orderDir:'desc', sayim:'yok' }, bas?eski:null)])
    .then(([a,h])=>{ HUNI.veri={ rows:a.rows, hata:h.rows, bas, tam:!bas || (!eski(a.rows) && !eski(h.rows)) }; return HUNI.veri; })
    .finally(()=>{ HUNI.yuk=null; });
  return HUNI.yuk;
}
// Seçilen dönem / platform / ülke: { R: huni satırları, H: hata satırları } · null: henüz okunmadı
function huniSuz(k, pf, cc, ym){
  const V=HUNI.veri, a=huniAra(k); if(!V) return null;
  if(a ? (!V.tam && V.bas>a[0]) : !V.tam) return null;
  ym=ym||HUNI.ym;
  const uy=x=>{ const g=String(x.gun).slice(0,10); return (!a || (g>=a[0] && g<=a[1])) && (pf==='tum' || x.platform===pf) && (!cc || x.ulke===cc)
    && (ym==='tum' || (x.yontem||'eposta')===ym); };
  return { R:V.rows.filter(uy), H:V.hata.filter(uy) };
}
const huniTop=(R, adim)=>R.reduce((t,x)=>t+(Number(x[adim])||0),0);
async function openHuni(){
  _opTemizle(); CUR='__huni__';
  $('nav').querySelectorAll('.sub').forEach(b => b.classList.toggle('active', b.dataset.t === '__huni__'));
  const act=$('nav').querySelector('.sub.active'); if(act) act.closest('.cat').classList.add('open');
  $('main').innerHTML=`<div class="titlebox fadein"><button class="backbtn" id="hnBack">‹ Geri</button><h2>Kayıt Hunisi</h2><span class="cnt" id="hnCnt"></span></div>
    <div class="ak-kart u-don fadein" id="hnDon"></div><div class="u-oz hn-oz fadein" id="hnOz"></div><div class="u-rk hn-tb fadein" id="hnTb"></div><div class="ak-bas fadein" id="hnHtB" style="display:none"><span>Hatalar</span></div><div class="hn-ht fadein" id="hnHt" style="display:none"></div>`;
  $('hnBack').onclick=openDash;
  huniYenile();
}
function huniYenile(){
  huniCiz();
  const ay=huniAra('ay')[0], a=huniAra(HUNI.k);
  const bas=a?(a[0]<ay?a[0]:ay):null;
  const V=HUNI.veri; if(V && (V.tam || (bas && V.bas<=bas))) return;
  huniYukle(bas).then(()=>{ if(CUR==='__huni__') huniCiz(); })
    .catch(e=>{ const o=$('hnOz'); if(o && CUR==='__huni__') o.innerHTML='<div class="msg err">'+uEsc(e.message)+'</div>'; });
}
function huniCiz(){
  const don=$('hnDon'); if(!don) return;
  const say=(k,pf)=>{ const S=huniSuz(k,pf,HUNI.cc); return S?huniTop(S.R,'acilis'):'…'; };
  const D=[['bugun','Bugün'],['ay','Bu ay'],['tum','Tüm zamanlar'],['ozel','Özel tarih']];
  const a=HUNI.k==='ozel'?huniAra('ozel'):null;
  don.innerHTML=`<div class="ak-cips">${D.map(([k,ad])=>`<button class="ak-cip u-sar${HUNI.k===k?' on':''}" data-d="${k}"><em>${say(k,HUNI.pf)}</em><span>${ad}</span></button>`).join('')}</div>`
    + (a?`<div class="u-don-t"><input type="date" class="bcinp" id="hnBas" value="${a[0]}" max="${uIstGun()}"><input type="date" class="bcinp" id="hnBit" value="${a[1]}" max="${uIstGun()}"></div>`:'')
    + `<div class="ak-cips">${HUNI_PF.map(([k,ad])=>`<button class="ak-cip u-mav${HUNI.pf===k?' on':''}" data-p="${k}"><em>${say(HUNI.k,k)}</em><span>${ad}</span></button>`).join('')}</div>`
    + `<div class="ak-cips">${HUNI_YM.map(([k,ad])=>{ const S=huniSuz(HUNI.k,HUNI.pf,HUNI.cc,k); return `<button class="ak-cip u-tur${HUNI.ym===k?' on':''}" data-y="${k}"><em>${S?huniTop(S.R,'acilis'):'…'}</em><span>${ad}</span></button>`; }).join('')}</div>`;
  don.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ HUNI.k=b.dataset.d; huniYenile(); });
  don.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ HUNI.pf=b.dataset.p; huniCiz(); });
  don.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{ HUNI.ym=b.dataset.y; huniCiz(); });
  const db=$('hnBas'), dt=$('hnBit');
  if(db) db.onchange=()=>{ if(db.value){ HUNI.bas=db.value; huniYenile(); } };
  if(dt) dt.onchange=()=>{ if(dt.value){ HUNI.bit=dt.value; huniYenile(); } };
  const oz=$('hnOz'), tb=$('hnTb'), ht=$('hnHt');
  const S=huniSuz(HUNI.k,HUNI.pf,HUNI.cc), R=S&&S.R;
  if(!S){ oz.innerHTML='<div class="msg">Yükleniyor…</div>'; tb.innerHTML=''; ht.style.display=$('hnHtB').style.display='none'; $('hnCnt').textContent=''; return; }
  // Huni
  const ac=huniTop(R,'acilis'), yuz=n=>ac?Math.round(n/ac*100):0;
  $('hnCnt').textContent=ac+' cihaz';
  let onc=null;
  const sat=(cls,ad,n,kay,ek)=>`<div class="s ${cls}${ek||''}"><div class="l"><i></i>${ad}</div><div class="n">${n}</div><div class="p">%${yuz(n)}</div><span class="hn-kay">${kay}</span><div class="bar"><b style="width:${yuz(n)}%"></b></div></div>`;
  oz.innerHTML=(HUNI.cc?`<div class="hn-ulke"><span class="bay">${ccFlag(HUNI.cc)}</span><b>${uEsc(CC_NAME[HUNI.cc]||HUNI.cc)}</b><button id="hnCcX" title="Tüm ülkeler">✕</button></div>`:'')
    + HUNI_ADIM.map(([k,ad,cls])=>{ const uc=k==='adim1', n=uc?huniUc(R):huniTop(R,k), kay=onc>0&&n<onc?'−%'+Math.round((onc-n)/onc*100):''; onc=n; return sat(cls,uc?HUNI_UC[HUNI.ym]:ad,n,kay); }).join('')
    + (HUNI.ym==='tum'||HUNI.ym==='eposta'?sat('u-gri','E-posta ile giriş',huniTop(R,'giris'),'',' hn-gir'):'')
    + (HUNI.ym!=='eposta'?sat('u-gri',HUNI.ym==='apple'?'Apple ile giriş':'Google ile giriş',huniTop(R,'sosyal_giris'),'',' hn-gir'):'');
  const x=$('hnCcX'); if(x) x.onclick=()=>{ HUNI.cc=null; huniCiz(); };
  // Ülkeler (seçili ülke vurgulanır, tıklayınca huni o ülkeye süzülür)
  const R0=HUNI.cc?huniSuz(HUNI.k,HUNI.pf,null).R:R, U={};
  R0.forEach(r=>{ const c=r.ulke||''; const u=U[c]||(U[c]={ cc:c }); HUNI_KOL.forEach(([k])=>{ u[k]=(u[k]||0)+(Number(r[k])||0); }); });
  const L=Object.values(U).filter(u=>u.acilis).sort((a,b)=>b.acilis-a.acilis||(b.hesap||0)-(a.hesap||0)||a.cc.localeCompare(b.cc));
  const orRenk=v=>v>=30?'u-yes':v>=15?'u-sar':'u-kir';
  tb.style.display=L.length?'':'none';
  tb.innerHTML=L.length?`<div class="r hn-r hn-bas"><span></span><span></span><span class="sol">Ülke</span>${HUNI_KOL.map(([,ad])=>`<span>${ad}</span>`).join('')}<span>Oran</span></div>`
    + L.map((u,i)=>{ const o=Math.round((u.hesap||0)/u.acilis*100);
        return `<div class="r hn-r${HUNI.cc===u.cc && u.cc?' on':''}" data-cc="${u.cc}"><span class="rk${i<3?' g'+(i+1):''}">${i+1}</span><span class="bay">${u.cc?ccFlag(u.cc):'🏳️'}</span>`
          + `<span class="ad">${uEsc(u.cc?(CC_NAME[u.cc]||u.cc):'Bilinmiyor')}${u.cc?`<small>${uEsc(u.cc)}</small>`:''}</span>`
          + HUNI_KOL.map(([k])=>`<span class="v${u[k]?'':' s0'}">${u[k]||0}</span>`).join('')
          + `<span class="or ${orRenk(o)}">%${o}</span></div>`; }).join('')
    :'';
  tb.querySelectorAll('.hn-r[data-cc]').forEach(r=>r.onclick=()=>{ const c=r.dataset.cc; if(!c) return; HUNI.cc=HUNI.cc===c?null:c; huniCiz(); });
  // Hatalar
  const H={}; S.H.forEach(r=>{ if(r.ayrinti) H[r.ayrinti]=(H[r.ayrinti]||0)+(Number(r.n)||0); });
  const HL=Object.entries(H).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'tr')).slice(0,15);
  ht.style.display=$('hnHtB').style.display=HL.length?'':'none';
  ht.innerHTML=HL.map(([m,n])=>`<div class="hn-h"><span title="${uEsc(m)}">${uEsc(m)}</span><b>${n}</b></div>`).join('');
}

/* 689 — KAPTANLAR · AKTİFLİK · SİLİNENLER
   Son giriş = players.son_aktif (oyun açıkken yazılan last_seen ile tazelenir; ayrı bir sorgu/tick yok).
   Sayaç 639'da başladı: o an bütün oyunculara aynı damga yazıldı → o damgayı taşıyanın gerçek son girişi o tarihten önce. */
const _AK_GUN=86400000;
function _akMs(t){ if(!t) return 0; const x=new Date(t).getTime(); return isNaN(x)?0:x; }
function _akDamga(oyn){
  const say={}; oyn.forEach(p=>{ if(p.son_aktif) say[p.son_aktif]=(say[p.son_aktif]||0)+1; });
  let d=null, n=0; for(const k in say) if(say[k]>n){ n=say[k]; d=k; }
  return n>=5?d:null;
}
function _akVeri(){
  const oyn=Object.values(UDATA.plMap).filter(p=>p&&p.user_id&&p.is_bot!==true);
  const damga=_akDamga(oyn), prof={};
  UDATA.all.forEach(p=>{ prof[uUid(p)]=p; });
  const simdi=Date.now();
  const L=UDATA.all.map(pf=>{
    const id=uUid(pf), pl=UDATA.plMap[id]||null;
    const once=!!(pl&&damga&&pl.son_aktif===damga);
    const ms=pl?_akMs(pl.son_aktif):0, kayit=_akMs(pf.created_at);
    const oyunda=!!(pl&&pl.last_seen&&simdi-_akMs(pl.last_seen)<=5*60000);
    // 718 — oyuncu kaydı olmayan yeni üye de 1 gün dolmadan 'hiç dönmedi' sayılmaz
    const donmedi=(!pl && (!kayit || simdi-kayit>_AK_GUN)) || (!!pl && !once && kayit && simdi-kayit>_AK_GUN && ms-kayit<_AK_GUN);
    return { pf, pl, id, ms, once, oyunda, donmedi, gun:ms?(simdi-ms)/_AK_GUN:Infinity };
  });
  return { L, damga, prof };
}
function _akRenk(gun){ return gun<=7?'u-yes':gun<=13?'u-sar':gun<=30?'u-tur':'u-kir'; }
function _akSure(x){
  if(!x.ms) return { b:'—', s:'oyuncu yok', c:'u-gri' };
  const t=new Date(x.ms), tarih=t.toLocaleDateString('tr',{ day:'2-digit', month:'2-digit', year:'numeric' });
  if(x.once) return { b:Math.floor(x.gun)+'+ gün', s:tarih+' öncesi', c:'u-gri' };
  if(x.oyunda) return { b:'<span class="ak-oyunda">Oyunda</span>', s:t.toLocaleTimeString('tr',{ hour:'2-digit', minute:'2-digit' }), c:'u-yes' };
  const dk=(Date.now()-x.ms)/60000;
  const b=dk<60?Math.max(1,Math.round(dk))+' dk':dk<1440?Math.round(dk/60)+' saat':x.gun<60?Math.floor(x.gun)+' gün':Math.floor(x.gun/30)+' ay';
  return { b, s:tarih+' '+t.toLocaleTimeString('tr',{ hour:'2-digit', minute:'2-digit' }), c:_akRenk(x.gun) };
}
function _akSatir(x, ek){
  const pf=x.pf, pl=x.pl||{}, c=uCountry(pf);
  const ad=pf.name||pf.username||'(isimsiz)', avS=pl.avatar_id?avSrc(pl.avatar_id):'';
  const tk=pl.team_name||'', so=_akSure(x);
  return `<div class="ak-r" data-ara="${uEsc(pf.username||ad)}">
    <div class="u-av">${avS?`<img src="${avS}" alt="">`:uEsc((String(ad).trim()[0]||'?').toUpperCase())}${c.flag?`<span class="flag">${c.flag}</span>`:''}</div>
    <div class="u-info">
      <div class="u-name">${uEsc(ad)}</div>
      <div class="u-mail">${pf.username?('@'+uEsc(pf.username)):''}</div>
      <div class="u-meta"><span>${tk?takimLogo(pl.country_code,tk):''}<b>${uEsc(tk||'Takımsız')}</b></span>${ek||''}</div>
    </div>
    <div class="ak-son ${so.c}"><b>${so.b}</b><small>${uEsc(so.s)}</small></div>
  </div>`;
}
function _akTikla(kap){
  kap.querySelectorAll('.ak-r[data-ara]').forEach(r=>r.onclick=()=>{
    const v=r.dataset.ara, inp=$('uSval'); if(inp) inp.value=v;
    USTATE.search=v; USTATE.offset=0; USTATE.sekme='liste'; loadUsers();
  });
}
function _akOz(satirlar, top){
  const yuz=n=>top?Math.round(n/top*100):0;
  return `<div class="u-oz">${satirlar.map(([cls,ad,n])=>`<div class="s ${cls}"><div class="l"><i></i>${ad}</div><div class="n">${n}</div><div class="p">%${yuz(n)}</div><div class="bar"><b style="width:${yuz(n)}%"></b></div></div>`).join('')}</div>`;
}

// KAPTANLAR — takım kaptanı olan gerçek kullanıcılar (en uzun girmeyen üstte; 21 gün kuralı: 14. günden itibaren uyarı)
async function uKaptanCiz(){
  const ek=$('uEk'); if(!ek) return;
  if(!UDATA.sozlesme){
    ek.innerHTML='<div class="msg">Yükleniyor…</div>';
    const r=await apiTum({ table:'takim_sozlesme', orderBy:'imzalandi', orderDir:'desc' }).catch(()=>({ rows:[] }));
    UDATA.sozlesme=r.rows||[];
    if(USTATE.sekme!=='kaptan') return;
  }
  const { L }=_akVeri();
  const K=L.filter(x=>x.pl&&x.pl.role==='captain'&&x.pl.team_name).sort((a,b)=>a.ms-b.ms);
  const kay={ sistem:'Sistemden', ilan:'İlandan', mevcut:'Önceden' };
  const soz=x=>UDATA.sozlesme.find(z=>z.user_id===x.id&&z.takim===x.pl.team_name&&z.cc===x.pl.country_code);
  const a7=K.filter(x=>x.gun<=7).length, a13=K.filter(x=>x.gun>7&&x.gun<14).length, a14=K.length-a7-a13;
  ek.innerHTML=_akOz([['u-yes','Son 7 günde girdi',a7],['u-sar','8 – 13 gündür yok',a13],['u-kir','14+ gündür yok',a14]], K.length)
    + `<div class="ak-bas"><span><b>${K.length}</b> kaptan</span></div>`
    + `<div class="u-list">${K.length?K.map(x=>{ const z=soz(x);
        return _akSatir(x, z?`<span>Kaptan: ${uEsc(new Date(z.imzalandi).toLocaleDateString('tr'))} · ${uEsc(kay[z.kaynak]||z.kaynak)}</span>`:''); }).join('')
      :'<div class="msg">Kayıt yok.</div>'}</div>`;
  _akTikla(ek);
}

// AKTİFLİK — son giriş: "girdi" (son 24 saat / 1 hafta / 1 ay / 3 ay) ve "girmedi" (1 hafta / 1 ay / 3 ay / kayıttan sonra hiç)
const AK_SUZ=[
  { k:'g1',  g:'gir',  ad:'24 saat', c:'u-yes', f:x=>!x.once&&x.gun<=1 },
  { k:'g7',  g:'gir',  ad:'1 hafta', c:'u-yes', f:x=>!x.once&&x.gun<=7 },
  { k:'g30', g:'gir',  ad:'1 ay',    c:'u-yes', f:x=>!x.once&&x.gun<=30 },
  { k:'g90', g:'gir',  ad:'3 ay',    c:'u-yes', f:x=>!x.once&&x.gun<=90 },
  { k:'y2',  g:'yok',  ad:'2 gün',   c:'u-sar', f:x=>x.ms&&x.gun>=2 },   // 718 — son girişi 2 gün ve daha eski
  { k:'y7',  g:'yok',  ad:'1 hafta', c:'u-sar', f:x=>x.ms&&x.gun>7 },
  { k:'y30', g:'yok',  ad:'1 ay',    c:'u-tur', f:x=>x.ms&&x.gun>30 },
  { k:'y90', g:'yok',  ad:'3 ay',    c:'u-kir', f:x=>x.ms&&x.gun>90 },
  { k:'hic', g:'yok',  ad:'Hiç dönmedi', c:'u-gri', f:x=>x.donmedi },
];
const AK_SAYFA=50;
let AK_SEC=null, AK_OFS=0;
function uAktifCiz(){
  const ek=$('uEk'); if(!ek) return;
  const { L }=_akVeri();
  const cip=d=>`<button class="ak-cip ${d.c}${AK_SEC===d.k?' on':''}" data-k="${d.k}"><em>${L.filter(d.f).length}</em><span>${d.ad}</span></button>`;
  const sec=AK_SUZ.find(d=>d.k===AK_SEC);
  let M=sec?L.filter(sec.f):L.slice();
  M.sort(sec&&sec.g==='yok'?((a,b)=>(a.ms||Infinity)-(b.ms||Infinity)):((a,b)=>b.ms-a.ms));
  const top=M.length, sayfa=Math.max(1,Math.ceil(top/AK_SAYFA)), cur=Math.min(sayfa,Math.floor(AK_OFS/AK_SAYFA)+1);
  const P=M.slice((cur-1)*AK_SAYFA, cur*AK_SAYFA);
  ek.innerHTML=`<div class="ak-kart">
      <div class="ak-sat"><b>Girdi</b><div class="ak-cips" style="grid-template-columns:repeat(${AK_SUZ.filter(d=>d.g==='gir').length},1fr)">${AK_SUZ.filter(d=>d.g==='gir').map(cip).join('')}</div></div>
      <div class="ak-sat"><b>Girmedi</b><div class="ak-cips" style="grid-template-columns:repeat(${AK_SUZ.filter(d=>d.g==='yok').length},1fr)">${AK_SUZ.filter(d=>d.g==='yok').map(cip).join('')}</div></div>
    </div>
    <div class="ak-bas"><span><b>${top}</b> kullanıcı</span></div>
    <div class="u-list">${P.length?P.map(x=>_akSatir(x, x.pf.created_at?`<span>Katılım: ${uEsc(new Date(x.pf.created_at).toLocaleDateString('tr'))}</span>`:'')).join(''):'<div class="msg">Kayıt yok.</div>'}</div>
    ${sayfa>1?`<div class="page"><button class="btn" id="akPrev" ${cur<=1?'disabled':''}>‹ Önceki</button><span class="cnt">${cur} / ${sayfa}</span><button class="btn" id="akNext" ${cur>=sayfa?'disabled':''}>Sonraki ›</button></div>`:''}`;
  ek.querySelectorAll('.ak-cip[data-k]').forEach(b=>b.onclick=()=>{ AK_SEC=(AK_SEC===b.dataset.k)?null:b.dataset.k; AK_OFS=0; uAktifCiz(); });
  const pv=$('akPrev'), nx=$('akNext');
  if(pv) pv.onclick=()=>{ AK_OFS=Math.max(0,AK_OFS-AK_SAYFA); uAktifCiz(); };
  if(nx) nx.onclick=()=>{ AK_OFS+=AK_SAYFA; uAktifCiz(); };
  _akTikla(ek);
}

// SİLİNENLER — silinen hesaplar (e-posta tutulmaz); "Aktif Et": verilen e-postayla hesap geri açılır, şifre belirleme e-postası gider
async function uSilinenCiz(){
  const ek=$('uEk'); if(!ek) return;
  if(!UDATA.silinen){
    ek.innerHTML='<div class="msg">Yükleniyor…</div>';
    try{ const r=await apiTum({ table:'silinen_hesaplar', orderBy:'silindi', orderDir:'desc' }); UDATA.silinen=r.rows||[]; }
    catch(e){ ek.innerHTML='<div class="msg err">'+uEsc(e.message)+'</div>'; return; }
    if(USTATE.sekme!=='silinen') return;
  }
  const S=UDATA.silinen, kendi=S.filter(x=>x.silen==='kendisi').length, acik=S.filter(x=>x.geri_acildi).length;
  const t=v=>v?new Date(v).toLocaleDateString('tr'):'—';

function wDegerDuzenle(cell){
  if(cell.querySelector('input')) return;
  const f=cell.dataset.f, w=WDATA.rows.find(x=>String(x.user_id)===cell.dataset.uid); if(!w) return;
  const vEl=cell.querySelector('.v'), eski=vEl.textContent;
  vEl.innerHTML='<input class="u-winput" type="number" step="1">';
  const inp=vEl.querySelector('input'); inp.value=Number(w[f])||0; inp.focus(); inp.select();
  let bitti=false;
  const kaydet=async()=>{
    if(bitti) return; bitti=true;
    const nv=Math.round(Number(inp.value));
    if(!isFinite(nv)){ vEl.textContent=eski; return; }
    vEl.textContent='…';
    try{ await api('update',{ table:'user_wallet', pk:pkObj(w,'user_wallet'), values:{ [f]:nv } }); w[f]=nv; wPaint(); }
    catch(e){ vEl.textContent=eski; alert('Kaydedilemedi: '+e.message); }
  };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } else if(e.key==='Escape'){ bitti=true; vEl.textContent=eski; } });
  inp.addEventListener('blur',kaydet);
}
async function wIslem(act, uid){
  const w=WDATA.rows.find(x=>String(x.user_id)===uid); if(!w) return;

    if(!confirm('"'+(p.name||p.username||'')+'" kullanıcısının cüzdanı silinsin mi? Parası ve elmasları gider.')) return;
    try{ await api('delete',{ table:'user_wallet', pk:pkObj(w,'user_wallet') }); WDATA.rows=WDATA.rows.filter(x=>x!==w); wPaint(); }
    catch(e){ alert('Silinemedi: '+e.message); }
  }
}

async function clubCounts(body){

      api('list',{ table:'team_data', limit:1, search:name, searchCol:'team_name' }).catch(()=>({count:0})),

    ]);
    const ek=body.querySelector('[data-kadro]'), ch=body.querySelector('[data-chat]');
    if(ek) ek.textContent=(d.count||0); if(ch) ch.textContent=(c.count||0);

async function clubSeason(body, name){
  // Menajer (kaptan)
  try{
    const cap=await api('list',{ table:'players', limit:60, search:name, searchCol:'team_name' }).catch(()=>({rows:[]}));
    const tm=(cap.rows||[]).filter(p=>String(p.team_name||'')===name);
    let captain=tm.find(p=>String(p.role||'').toLowerCase()==='captain') || tm.find(p=>p.user_team_data&&typeof p.user_team_data==='object'&&p.user_team_data.role==='captain');
    if(!captain) captain=tm.slice().sort((x,y)=>(Number(y.overall)||0)-(Number(x.overall)||0))[0];
    const mgrEl=body.querySelector('[data-mgr]'); if(mgrEl) mgrEl.textContent = captain?((captain.name||'—')+(captain.user_id?' · kullanıcı':'')):'—';
  }catch(e){ const mgrEl=body.querySelector('[data-mgr]'); if(mgrEl) mgrEl.textContent='—'; }
  // Sezon galibiyet/averaj — yalnız takımın kendi maçları (hafif)
  try{
    const [hm,am]=await Promise.all([
      api('list',{ table:'match_state', limit:200, search:name, searchCol:'home_team' }).catch(()=>({rows:[]})),
      api('list',{ table:'match_state', limit:200, search:name, searchCol:'away_team' }).catch(()=>({rows:[]}))
    ]);
    const fin=[...(hm.rows||[]),...(am.rows||[])].filter(m=>m.status==='finished' && !m.tournament_key && (m.home_team===name||m.away_team===name));
    let season=null; fin.forEach(m=>{ const sn=Number(m.season)||0; if(season===null||sn>season) season=sn; });
    const st={o:0,g:0,b:0,m:0,ag:0,yg:0};
    fin.filter(m=>Number(m.season)===season).forEach(m=>{ const home=m.home_team===name; const hs=Number(m.home_score)||0,as_=Number(m.away_score)||0; const gf=home?hs:as_,ga=home?as_:hs; st.o++;st.ag+=gf;st.yg+=ga; if(gf>ga)st.g++; else if(gf<ga)st.m++; else st.b++; });
    const setn=(sel,v)=>{ const e=body.querySelector(sel); if(e) e.textContent=v; };
    setn('[data-st-o]',st.o);setn('[data-st-g]',st.g);setn('[data-st-b]',st.b);setn('[data-st-m]',st.m);setn('[data-st-ag]',st.ag);setn('[data-st-yg]',st.yg);
  }catch(e){}
}

    const votes=(fed&&fed.votes&&typeof fed.votes==='object'&&!Array.isArray(fed.votes))?fed.votes:{};
    const totalVotes=Object.values(votes).reduce((a,b)=>a+(Number(b)||0),0);
    const phase=fed?(FED_PHASE[fed.phase]||fed.phase||'—'):'—';
    const vices=fed?nArr(fed.vice).map(v=>nWho(FDATA.who,v)).filter(x=>x&&x!=='—'):[];
    const viceCells=[0,1].map(k=>{ const nm=vices[k]; return `<div class="u-wl-c" style="border-color:rgba(255,213,79,.3)"><span class="ic">🅰️</span><div class="tx"><div class="v">${nm?uEsc(nm):'—'}</div><div class="l">Yardımcı ${k+1}</div></div></div>`; }).join('');

async function fedEvents(body){
  if(!body || body.dataset.loaded==='1') return; body.dataset.loaded='1';
  const cc=String(body.dataset.cc||'').toUpperCase();
  try{
    const r=await api('list',{ table:'federation_votes', limit:40, search:cc, searchCol:'country_code', orderBy:'election_season', orderDir:'desc' });
    const rows=(r.rows||[]).filter(v=>String(v.country_code||'').toUpperCase()===cc);
    const ev=body.querySelector('[data-events]'); if(!ev) return;
    ev.innerHTML = rows.length ? rows.slice(0,25).map(v=>`<div class="nt-pl"><span class="nm">${uEsc(v.voter_team||'?')} <span style="color:#5c6470">→</span> ${uEsc(v.candidate_team||'?')}</span><span class="ps">S${uEsc(v.election_season!=null?v.election_season:'?')}</span></div>`).join('') : '<div class="u-empty">Henüz oy/seçim olayı yok.</div>';
  }catch(e){ const ev=body.querySelector('[data-events]'); if(ev) ev.innerHTML='<div class="u-empty">Olaylar yüklenemedi.</div>'; }
}
function renderFeds(){
  const head=`
    <div class="titlebox fadein">
      <button class="backbtn" id="fBack">‹ Geri</button>
      <h2>Federasyonlar</h2>
      <span class="cnt" id="fCnt">${FDATA.count} federasyon</span>
      <div class="sp"></div>
      <input id="fSval" placeholder="ülke ara…" value="${uEsc(FSTATE.search)}" autocomplete="off">
    </div>`;
  $('main').innerHTML = head + `<div class="u-list fadein" id="fList"></div>`;
  $('fBack').onclick=openDash;
  const inp=$('fSval');
  inp.addEventListener('input', ()=>{ clearTimeout(window._fT); window._fT=setTimeout(()=>{ FSTATE.search=inp.value.trim(); FApplyFilter(); fedPaint(); }, 110); });
  fedPaint();
  if(FSTATE.search){ inp.focus(); try{ inp.setSelectionRange(inp.value.length,inp.value.length); }catch(e){} }
}
function fedPaint(){
  const list=$('fList'); if(!list) return;
  list.innerHTML = FDATA.rows.length?fedCardsHTML():'<div class="msg">Eşleşen federasyon yok.</div>';
  const cnt=$('fCnt'); if(cnt) cnt.textContent=FDATA.count+' federasyon';
  list.querySelectorAll('.u-head').forEach(h=>h.onclick=()=>{ const c=h.parentElement; c.classList.toggle('open'); if(c.classList.contains('open')) fedEvents(c.querySelector('.u-body')); });
  list.querySelectorAll('.u-act').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); fedAction(b.dataset.act,+b.dataset.i); });
}
function fedAction(act,i){
  const r=FDATA.rows[i]; if(!r) return;
  if(act==='edit'){ if(r.fed) openEditor('edit', r.fed, 'federation_state', loadFeds); else openEditor('add', { country_code:r.cc }, 'federation_state', loadFeds); return; }
  if(act==='votes'){ openTableFiltered('federation_votes','country_code', r.cc||'', openFeds); return; }
}

function uWalletStart(cell){
  if(cell.querySelector('input')) return;
  const f=cell.dataset.f, i=+cell.dataset.i, p=UDATA.rows[i]; if(!p) return;
  const id=uUid(p);
  let cur=0;
  if(f==='energy'){ const up=UDATA.pMap[id]; if(!up){ alert('Bu kullanıcının oyuncu kaydı yok, enerji atanamaz.'); return; } cur=(typeof up.energy==='number')?up.energy:0; }
  else { const w=UDATA.wMap[id]; if(!w){ alert('Bu kullanıcının cüzdan kaydı yok.'); return; } cur=Number(w[f])||0; }
  const vEl=cell.querySelector('.v'); const old=vEl.textContent;
  vEl.innerHTML='<input class="u-winput" type="number" step="1">';
  const inp=vEl.querySelector('input'); inp.value=cur; inp.focus(); inp.select();
  let done=false;
  const cancel=()=>{ if(done) return; done=true; vEl.textContent=old; };
  const save=async()=>{
    if(done) return; done=true;
    const nv=Math.round(Number(inp.value));
    if(!isFinite(nv)){ vEl.textContent=old; return; }
    vEl.textContent='…';
    try{
      if(f==='energy'){
        await api('update',{ table:'user_player', pk:pkObj(UDATA.pMap[id],'user_player'), values:{ energy:nv } });
        UDATA.pMap[id].energy=nv;
      } else {
        await api('update',{ table:'user_wallet', pk:pkObj(UDATA.wMap[id],'user_wallet'), values:{ [f]:nv } });
        UDATA.wMap[id][f]=nv;
      }
      vEl.textContent=nv.toLocaleString('tr');
    }catch(e){ vEl.textContent=old; alert('Kaydedilemedi: '+e.message); }
  };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } else if(e.key==='Escape'){ done=true; vEl.textContent=old; } });
  inp.addEventListener('blur',save);
}

function edMevkiYazi(pl){
  const g=_pmGroupOf(pl.pos_group||pl.pos||''), sub=String(pl.sub_pos||'').toUpperCase();
  if(!pl.pos && !pl.pos_group) return '—';
  const so=(SUB_POS_ADM[g]||[]).find(o=>o[0]===sub);
  return (MAIN_POS_ADM.find(o=>o[0]===g)||[g,g])[1]+(so?(' · '+so[0]+' '+so[1]):'');
}
let ED=null;
function edAc(tur,i){
  const p=UDATA.rows[i]; if(!p) return; const id=uUid(p); const pl=UDATA.plMap[id];
  if(!pl && tur!=='profil' && tur!=='sil'){ alert('Bu kullanıcının oyuncu kaydı yok.'); return; }
  const utd=(pl&&pl.user_team_data&&typeof pl.user_team_data==='object')?pl.user_team_data:{};
  ED={ tur, p, pl, id, sec:null, cins:'M', takim:null, rol:String((pl&&pl.role)||utd.role||'member').toLowerCase() };
  if(!ED_ROL.some(o=>o[0]===ED.rol)) ED.rol='member';
  $('edBaslik').innerHTML=({ mevki:'Mevki', avatar:'Avatar', takim:'Takım', rol:'Takımdaki Rol', profil:'Profil', sil:'Kullanıcıyı Sil' })[tur]+' — <span>'+uEsc(p.name||p.display_name||p.username||'')+'</span>';
  $('edErr').textContent='';
  $('edTakimsiz').style.display=(tur==='takim'&&pl.team_name)?'':'none';
  $('edKaydet').style.display='';
  $('edKaydet').className=(tur==='sil')?'btn red':'btn green';
  $('edKaydet').textContent=(tur==='sil')?'Hesabı Sil':'Kaydet';
  $('edKaydet').disabled=(tur==='sil');
  if(tur==='profil'){ $('edAlt').innerHTML=uEsc(p.email||''); edProfilCiz(); }
  if(tur==='sil'){ $('edAlt').innerHTML=''; edSilCiz(); }
  if(tur==='mevki'){ ED.sec=String(pl.sub_pos||'').toUpperCase()||null; $('edAlt').innerHTML='Şu an: <b>'+uEsc(edMevkiYazi(pl))+'</b>. Yan mevkiyi seç; ana mevki ona göre ayarlanır. Yetenekler korunur.'; edMevkiCiz(); }
  if(tur==='avatar'){ ED.sec=pl.avatar_id||null; const a=AV_SEC.find(x=>x.id===ED.sec); ED.cins=a?a.c:'M'; $('edAlt').innerHTML='Şu an: <b>'+uEsc(pl.avatar_id||'avatar yok')+'</b>'; edAvatarCiz(); }
  if(tur==='rol'){ $('edAlt').innerHTML='<b>'+uEsc(pl.team_name)+'</b> takımında. Kaptan seçilirse takımın kaptanı üye olur; kaptan değişirse kaptanlık yardımcı kaptana, yoksa en güçlü oyuncuya geçer.'; edRolCiz($('edGovde'), false); }

}

async function edKaydet(){
  if(!ED) return; const { tur, pl, id } = ED; $('edErr').textContent='';
  try{
    if(tur==='mevki'){
      if(!ED.sec){ $('edErr').textContent='Bir mevki seç.'; return; }
      const g=MAIN_POS_ADM.map(o=>o[0]).find(k=>(SUB_POS_ADM[k]||[]).some(o=>o[0]===ED.sec));
      await api('update',{ table:'players', pk:pkObj(pl,'players'), values:{ pos:g, pos_group:g, sub_pos:ED.sec } });
      Object.assign(pl,{ pos:g, pos_group:g, sub_pos:ED.sec });
    } else if(tur==='avatar'){
      if(!ED.sec){ $('edErr').textContent='Bir avatar seç.'; return; }
      await api('update',{ table:'players', pk:pkObj(pl,'players'), values:{ avatar_id:ED.sec } });
      pl.avatar_id=ED.sec;
    } else if(tur==='rol'){
      await api('oyuncu_rol',{ user_id:id, role:ED.rol }); await edYenile();
    } else if(tur==='takim'){
      if(!ED.takim){ $('edErr').textContent='Listeden bir takım seç.'; return; }
      await api('oyuncu_takim',{ user_id:id, cc:ED.takim.cc, team:ED.takim.name, role:ED.rol }); await edYenile();
    } else if(tur==='profil'){
      const f=ED.form, ad=f.ad.trim(), kul=f.kul.trim().replace(/^@+/,'');
      if(ad.length<2||ad.length>32||!/^[\p{L} .'-]+$/u.test(ad)){ $('edErr').textContent='Ad 2–32 karakter; yalnız harf, boşluk, tire ve kesme işareti.'; return; }
      if(kul.length<3||kul.length>20||!/^[\p{L}\p{N}._-]+$/u.test(kul)){ $('edErr').textContent='Kullanıcı adı 3–20 karakter; harf, rakam, nokta, alt çizgi ve tire.'; return; }
      if(!f.cc){ $('edErr').textContent='Uyruk seç.'; return; }
      const v={ user_id:id, name:ad, username:kul, nationality:f.cc };
      if(_profilYasVar()) v.age=f.yas||null;
      await api('profil_kaydet', v);
      Object.assign(ED.p,{ name:ad, username:kul, nationality:f.cc }); if('age' in v) ED.p.age=v.age;
      if(pl) Object.assign(pl,{ name:ad, nationality:f.cc });
    } else if(tur==='aktif'){
      const email=$('slEposta').value.trim(), x=ED.sil;
      $('edKaydet').disabled=true; $('edKaydet').textContent='Açılıyor…';
      let d;
      try{ d=await hesapAc(x.id, email); }
      catch(e){ $('edKaydet').disabled=false; $('edKaydet').textContent='Aktif Et'; throw e; }
      Object.assign(x,{ geri_acildi:new Date().toISOString(), geri_uid:d.uid });
      $('edModal').style.display='none'; ED=null;
      const not=[d.sifreEpostasi==='gonderildi'?'Şifre belirleme e-postası gönderildi: '+email:'Şifre e-postası gönderilemedi ('+d.sifreEpostasi+'). Oyuncu giriş ekranında "Şifremi Unuttum" ile aynı e-postayı yazabilir.'];
      if(d.username && d.username!==x.kullanici_adi) not.push('Kullanıcı adı alınmıştı, yeni adı: @'+d.username);
      if(d.esyaDusen) not.push(d.esyaDusen+' eşya stokta kalmadığı için geri verilmedi.');
      UDATA.pLoaded=false; await loadUsers();
      alert('Hesap aktif edildi.\n'+not.join('\n'));
      return;
    } else if(tur==='sil'){
      if(!edSilOnayli()) return;

      UDATA.pLoaded=false; await loadUsers();
    }
    $('edModal').style.display='none'; ED=null; uPaintList();
  }catch(e){ $('edErr').textContent=e.message; }
}

const MAGAZA_ITEM=/^(gk[1-7]|atk[1-8]|pm[1-8]|def[1-8]|men[1-8])$/;
function pmRenderEquip(){
  const box=$('pmEquip'); if(!box) return;
  const eq=PMX.equipment||{}; const ward=Array.isArray(eq.wardrobe)?eq.wardrobe:[]; const slots=Array.isArray(eq.activeSlots)?eq.activeSlots:[];
  const acik=i=>Array.isArray(eq.unlockedSlots)?!!eq.unlockedSlots[i]:(i<Math.max(1,Number(eq.unlockedSlots)||0,slots.filter(Boolean).length));
  const adi=idv=>{ const w=ward.find(x=>x&&x.id===idv); return w?(w.name||w.id):idv; };
  let h='<div class="sub-l">Takılı</div><div class="slots">';
  for(let i=0;i<5;i++){ const it=slots[i];
    if(it) h+=`<div class="slot on"><span class="x" data-slot="${i}" title="Çıkar">✕</span><span class="nm">${uEsc(adi(it))}</span></div>`;
    else if(acik(i)) h+='<div class="slot"><span class="bos">Boş</span></div>';
    else h+=`<div class="slot lock">${PM_IK.kilit}</div>`; }
  h+='</div><div class="sub-l">Dolap · '+ward.length+' item</div><div class="chips">'
    +(ward.length?ward.map((w,i)=>`<span class="chip">${uEsc((w&&(w.name||w.id))||('item '+(i+1)))}${slots.includes(w&&w.id)?' <small>takılı</small>':''} <span class="x" data-ward="${i}" title="Dolaptan al">✕</span></span>`).join(''):'<span style="font-size:12px;color:#5c6470">Dolap boş</span>')+'</div>';
  if(PMX.iade.length) h+=`<div class="eq-iade">${PMX.iade.length} item kaydedince mağaza stoğuna döner.</div>`;
  box.innerHTML=h;
  box.querySelectorAll('[data-slot]').forEach(x=>x.onclick=()=>{ PMX.equipment.activeSlots[+x.dataset.slot]=null; pmRenderEquip(); });
  box.querySelectorAll('[data-ward]').forEach(x=>x.onclick=()=>{ const i=+x.dataset.ward; const rid=ward[i]&&ward[i].id; PMX.equipment.wardrobe.splice(i,1);
    if(rid&&Array.isArray(PMX.equipment.activeSlots)) PMX.equipment.activeSlots=PMX.equipment.activeSlots.map(v=>v===rid?null:v);
    if(rid&&MAGAZA_ITEM.test(rid)) PMX.iade.push(rid);
    pmRenderEquip(); });
}

async function savePlayerModal(){
  if(!PM_TARGET) return; const id=uUid(PM_TARGET); $('pmErr').textContent='';
  const up=UDATA.pMap[id], pl=UDATA.plMap[id];
  if(!up && !pl){ $('pmErr').textContent='Kaydedilecek kayıt yok.'; return; }
  const ayni=(x,y)=>JSON.stringify(x===undefined?null:x)===JSON.stringify(y===undefined?null:y);
  const vals={}, pv={};
  if(up){
    const degisen=[...$('pmSkills').querySelectorAll('input[data-sk]')].filter(inp=>inp.value.trim()!==''&&inp.value!==inp.defaultValue);
    if(degisen.length){
      const skills=(up.skills&&typeof up.skills==='object')?_pmClone(up.skills):{};
      ['GK','DEF','MID','FWD'].forEach(g=>{ if(!skills[g]||typeof skills[g]!=='object') skills[g]={}; });
      degisen.forEach(inp=>{ const g=inp.dataset.g, sid=inp.dataset.sk, e=skills[g][sid];
        skills[g][sid]={ level:Math.max(10,Math.round(Number(inp.value))||10), points:(e&&typeof e==='object')?(e.points||0):0 }; });
      vals.skills=skills;
    }
    const allCols=((META.user_player&&META.user_player.columns)||[]);
    let hata=null;
    $('pmAdvB').querySelectorAll('input[data-c]').forEach(el=>{ const n=el.dataset.c, t=(allCols.find(c=>c.name===n)||{}).type||'text';
      const v=coerce(t, el.value); if(!ayni(v, up[n])) vals[n]=v; });
    $('pmAdvB').querySelectorAll('.sw[data-bool]').forEach(sw=>{ const v=sw.classList.contains('on'); if(v!==!!up[sw.dataset.c]) vals[sw.dataset.c]=v; });
    if($('pmAdvB').querySelector('[data-ach]')){
      const as=_pmClone((up.ach_stats&&typeof up.ach_stats==='object')?up.ach_stats:{}); let d=false;
      $('pmAdvB').querySelectorAll('[data-ach]').forEach(el=>{ const v=el.value.trim(), n=(v===''?0:Number(v)); if(n!==Number(as[el.dataset.ach])){ as[el.dataset.ach]=n; d=true; } });
      if(d) vals.ach_stats=as;
    }
    if($('pmTrophies') && !ayni(PMX.trophies, Array.isArray(up.trophies)?up.trophies:[])) vals.trophies=PMX.trophies;
    if($('pmEquip') && !ayni(PMX.equipment, (up.equipment&&typeof up.equipment==='object')?up.equipment:{})) vals.equipment=PMX.equipment;
    $('pmAdvB').querySelectorAll('textarea[data-cj]').forEach(el=>{ if(el.value===el.defaultValue) return; const n=el.dataset.cj, t=el.value.trim();
      try{ vals[n]=(t===''?null:JSON.parse(t)); }catch(e){ hata=_pmEt(n)+': geçersiz veri ('+e.message+')'; } });
    if(hata){ $('pmErr').textContent=hata; return; }
  }
  if(pl){
    const lvl=$('pmInLvl').value.trim(), xp=$('pmInXp').value.trim();
    if(lvl!=='') pv.level=Math.round(Number(lvl));
    if(xp!=='') pv.xp=Math.round(Number(xp));
    const grp=$('pmInPos').value, sub=$('pmInSub').value; if(grp){ pv.pos=grp; pv.pos_group=grp; } if(sub) pv.sub_pos=sub;
  }
  $('pmSave').disabled=true;
  try{
    if(up && Object.keys(vals).length) await api('update',{ table:'user_player', pk:pkObj(up,'user_player'), values:vals });
    let yeni=null;
    if(pl && Object.keys(pv).length){ const r=await api('update',{ table:'players', pk:pkObj(pl,'players'), values:pv }); yeni=(r.rows||[])[0]||null; }
    if(PMX.iade.length){ await api('stok_iade',{ items:PMX.iade }); PMX.iade=[]; }
    if(up) Object.assign(up, vals);
    if(pl){ Object.assign(pl, pv); if(yeni&&yeni.overall!=null) pl.overall=yeni.overall; }
    $('playerModal').style.display='none'; uPaintList();
  }catch(e){ $('pmErr').textContent=e.message; }
  finally{ $('pmSave').disabled=false; }
}

let BAN_TARGET=null, BAN_DUR=null, BAN_SONRA=null;
// Oyundaki şikayet sebebi → engel sebebi
const BAN_SEBEP={ 'Küfür veya hakaret':'Hakaret / küfür / kötü dil', 'Taciz veya zorbalık':'Takım & sohbet tacizi',
  'Spam veya reklam':'Spam / reklam', 'Uygunsuz içerik':'Uygunsuz isim / avatar / içerik' };
function openBanModal(p, ek){
  BAN_TARGET=p; BAN_DUR=null; BAN_SONRA=(ek&&ek.sonra)||null;
  $('banName').textContent = p.name||p.username||'';
  $('banErr').textContent='';
  $('banReason').selectedIndex=0;
  $('banReasonOther').style.display='none'; $('banReasonOther').value='';
  const es=ek&&ek.sebep, kar=es&&BAN_SEBEP[es];
  if(kar) $('banReason').value=kar;
  else if(es==='Diğer'){ $('banReason').value='__other__'; $('banReasonOther').style.display='block'; }
  const bi=uBanInfo(p);
  $('banNot').innerHTML=[ ek&&ek.not?('Şikayet: <b>'+uEsc(ek.not)+'</b>'):'',
    bi?('<span class="k">Şu an engelli</span> · '+(bi.perm?'süresiz':(bi.until.toLocaleDateString('tr')+' tarihine kadar'))):'' ].filter(Boolean).join('<br>');
  $('banDurs').querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  $('banModal').style.display='flex';

async function applyBan(){
  if(!BAN_TARGET) return;
  if(BAN_DUR==null){ $('banErr').textContent='Lütfen bir süre seç.'; return; }
  let reason=$('banReason').value;
  if(reason==='__other__'){ reason=$('banReasonOther').value.trim(); if(!reason){ $('banErr').textContent='Özel sebep yaz.'; return; } }
  let until;
  if(BAN_DUR==='perm') until='9999-12-31T23:59:59+00:00';
  else { const d=new Date(); d.setDate(d.getDate()+Number(BAN_DUR)); until=d.toISOString(); }
  try{
    await api('update',{ table:'profiles', pk:pkObj(BAN_TARGET,'profiles'), values:{ ban_until:until, ban_reason:reason } });
    Object.assign(BAN_TARGET,{ ban_until:until, ban_reason:reason });
    $('banModal').style.display='none';
    if(BAN_SONRA){ const sonra=BAN_SONRA; BAN_SONRA=null; await sonra(); } else loadUsers();
  }catch(e){ $('banErr').textContent=e.message; }
}
async function uUnban(p){
  if(!confirm('"'+(p.name||p.username||'')+'" için engeli kaldırmak istediğine emin misin?')) return;
  try{ await api('update',{ table:'profiles', pk:pkObj(p,'profiles'), values:{ ban_until:null, ban_reason:null } }); Object.assign(p,{ ban_until:null, ban_reason:null }); loadUsers(); }
  catch(e){ alert('Olmadı: '+e.message); }
}

function _opBaslik(ad, alt) {
  return `<div class="titlebox fadein"><h2>${ad}</h2><span class="cnt">${alt||''}</span></div>`;
}
function _opKart(lbl, val, alt, renk) {
  const c = renk === 'k' ? 'var(--red)' : renk === 's' ? 'var(--gold)' : 'var(--accent)';
  const b = renk === 'k' ? 'rgba(226,59,90,.38)' : renk === 's' ? 'var(--goldln)' : 'rgba(46,195,107,.34)';
  return `<div class="opk" style="border-color:${b}">
    <div class="opk-l">${lbl}</div>
    <div class="opk-v" style="color:${c}">${val}</div>
    <div class="opk-a">${alt||''}</div></div>`;
}
function _opSatir(ic, ad, alt, sag) {
  return `<div class="opsat"><div class="opsat-i">${ic}</div>
    <div class="opsat-o"><div class="opsat-ad">${ad}</div><div class="opsat-alt">${alt||''}</div></div>
    <div class="opsat-s">${sag||''}</div></div>`;
}
const _opBaslikMini = (t) => `<div class="opbas">${t}</div>`;
function _opTemizle() {
  CUR = null;
  $('dashBtn').classList.remove('active');
  document.body.classList.remove('navopen');
}
function _fmtSayi(n){ return (Number(n)||0).toLocaleString('tr'); }
function _fmtPara(n){
  const v = Number(n)||0;
  if (Math.abs(v) >= 1e6) return (v/1e6).toFixed(1).replace('.',',') + ' M';
  if (Math.abs(v) >= 1e3) return Math.round(v/1e3) + ' K';
  return String(Math.round(v));
}
function _gecenSure(iso){
  if (!iso) return '—';
  const d = new Date(iso); if (isNaN(d)) return '—';
  const sn = Math.max(0, Math.floor((Date.now() - d.getTime())/1000));
  if (sn < 60) return sn + ' sn önce';
  if (sn < 3600) return Math.floor(sn/60) + ' dk önce';
  if (sn < 86400) return Math.floor(sn/3600) + ' sa önce';
  return Math.floor(sn/86400) + ' gün önce';
}

  const act = $('nav').querySelector('.sub.active'); if (act) act.closest('.cat').classList.add('open');
  $('main').innerHTML = _opBaslik('Operasyon','durum yükleniyor…') + '<div class="msg">Yükleniyor…</div>';

  let ws = null, canli = [], takili = [], aktif = 0, ntp = null;
  try {
    const [rws, rrun, rntp] = await Promise.all([
      api('list',{ table:'world_state', limit:1 }).catch(()=>null),
      api('list',{ table:'match_state', limit:200, search:'running', searchCol:'status' }).catch(()=>null),
      api('list',{ table:'team_data', limit:1, search:'nt_power', searchCol:'data_key' }).catch(()=>null),
    ]);
    ws  = rws && rws.rows && rws.rows[0];
    canli = (rrun && rrun.rows) || [];
    ntp = rntp && rntp.rows && rntp.rows[0];
  } catch(e) {}

  // Takılan maç: running ve sim_minute >= 90
  takili = canli.filter(m => (Number(m.sim_minute)||0) >= 90);
  OPS_STUCK = takili;

  // Aktif oyuncu — players.last_seen son 5 dk
  try {
    const r = await apiTum({ table:'players', orderBy:'user_id', orderDir:'asc', cols:'user_id,last_seen', sayim:'yok' }, _gercekBitti);
    const sinir = Date.now() - 5*60*1000;
    aktif = (r.rows||[]).filter(p => p.last_seen && new Date(p.last_seen).getTime() > sinir).length;
  } catch(e) {}

  const d = (ws && ws.data) || {};
  const sezon = d.season || '—';
  const gun   = d.dayInSeason || d.day || '—';
  const ntAt  = ntp && ntp.data && ntp.data.at;

  const kartlar = [
    _opKart('Canlı Maç', _fmtSayi(canli.length), 'devam ediyor', 'y'),
    _opKart('Takılan Maç', _fmtSayi(takili.length), '90+ dk, bitmemiş', takili.length ? 's' : 'y'),
    _opKart('Aktif Oyuncu', _fmtSayi(aktif), 'son 5 dakika', 'y'),
    _opKart('Sezon', String(sezon), 'gün ' + gun + ' / 40', 'y'),
    _opKart('Milli Güçler', ntAt ? 'Güncel' : '—', ntAt ? _gecenSure(ntAt) : 'hesaplanmadı', ntAt ? 'y' : 's'),
  ].join('');

  const otomatik = [
    _opSatir('🔄','Maç motoru (cron)','Her dakika çalışır — maçları ilerletir','<span class="oproz oto">Otomatik</span>'),
    _opSatir('🏆','Turnuva kurulumu ve kura','Sezon takvimine bağlı','<span class="oproz oto">Otomatik</span>'),
    _opSatir('📅','Sezon geçişi','Gün 40 sonunda uygulanır','<span class="oproz oto">Otomatik</span>'),
    _opSatir('🌍','Milli takım güçleri','6 saatte bir hesaplanır' + (ntAt ? ' · son: ' + _gecenSure(ntAt) : ''),'<span class="oproz oto">Otomatik</span>'),
  ].join('');

  const onarim = [
    _opSatir('🩹','Takılan maçları bitir',
      takili.length ? (takili.length + ' maç 90+ dakikada asılı kalmış') : 'Takılan maç yok',
      takili.length ? '<button class="btn gold" id="opStuck">İncele</button>'
                    : '<span class="oproz ok">Temiz</span>'),
  ].join('');

  $('main').innerHTML = _opBaslik('Operasyon','sistem durumu · salt okuma')
    + `<div class="opgrid fadein">${kartlar}</div>`
    + _opBaslikMini('Otomatik Süreçler')
    + `<div class="fadein">${otomatik}</div>`
    + _opBaslikMini('Onarım İşlemleri')
    + `<div class="fadein">${onarim}</div>`
    + `<div class="opnot">Sezon geçişi, kura çekimi ve güç hesaplaması oyunun akışına aittir ve
       yalnızca sunucuda otomatik çalışır. Buradan tetiklenemez. Onarım işlemleri akışı değiştirmez,
       yalnızca bozulan kaydı düzeltir.</div>`;

  const sb = $('opStuck'); if (sb) sb.onclick = opStuckList;
}

function opStuckList() {
  const rows = OPS_STUCK.map(m => `<tr>
      <td class="opmono">${m.match_key||''}</td>
      <td>${m.home_team||''} — ${m.away_team||''}</td>
      <td>${m.home_score??0}-${m.away_score??0}</td>
      <td>${m.sim_minute||0}'</td>
      <td class="opsag"><button class="btn red" data-mk="${m.match_key}">Bitir</button></td>
    </tr>`).join('');
  $('main').innerHTML = `<div class="titlebox fadein">
      <button class="backbtn" id="opBack">‹ Geri</button><h2>Takılan Maçlar</h2>
      <span class="cnt">${OPS_STUCK.length} maç</span></div>
    <div class="tablewrap fadein"><div class="scroll"><table>
      <thead><tr><th>Anahtar</th><th>Takımlar</th><th>Skor</th><th>Dk</th><th>İşlem</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    <div class="opnot">"Bitir" maçı <b>finished</b> durumuna alır ve dakikayı 90'a sabitler.
    Skor değiştirilmez. Bu işlem oyunun akışını değiştirmez, yalnızca asılı kalmış kaydı kapatır.</div>`;
  $('opBack').onclick = openOps;
  $('main').querySelectorAll('button[data-mk]').forEach(b => b.onclick = async () => {
    if (!confirm('Bu maç bitirilecek. Onaylıyor musun?')) return;
    b.disabled = true; b.textContent = '…';
    try {
      await api('update', { table:'match_state', pk:{ match_key: b.dataset.mk },
                            values:{ status:'finished', sim_minute:90 } });
      b.textContent = '✓ Bitti';
    } catch(e) { b.disabled = false; b.textContent = 'Hata'; alert(e.message); }
  });
}

  30:'Maaş', 34:'EURO G1', 35:'EURO G2', 36:'EURO G3',

async function openSeason() {
  _opTemizle();
  $('nav').querySelectorAll('.sub').forEach(b => b.classList.toggle('active', b.dataset.t === '__season__'));
  const act = $('nav').querySelector('.sub.active'); if (act) act.closest('.cat').classList.add('open');
  $('main').innerHTML = _opBaslik('Sezon & Takvim','yükleniyor…') + '<div class="msg">Yükleniyor…</div>';

  let d = {}, maclar = [];
  try {
    const r = await api('list',{ table:'world_state', limit:1 });
    d = (r.rows && r.rows[0] && r.rows[0].data) || {};
  } catch(e) {}
  try {
    const r = await api('list',{ table:'match_state', limit:1000, orderBy:'kickoff_at', orderDir:'asc' });
    maclar = r.rows || [];
  } catch(e) {}

  const sezon = d.season || 1;

  const gunSay = {};
  maclar.forEach(m => { const g = m.day_in_season; if (g) gunSay[g] = (gunSay[g]||0)+1; });

    const ozel = SEZON_TAKVIM[g];

    if (ozel && /EURO/.test(ozel)) cls += ' enc';

    else if (say) cls += ' lig';
    if (g === gun) cls += ' bugun';
    hucreler += `<div class="${cls}"><b>${g}</b><small>${ozel || (say ? say+' maç' : '—')}</small></div>`;
  }

  $('main').innerHTML = _opBaslik('Sezon ' + sezon + ' · Gün ' + gun, 'sezon sonuna ' + Math.max(0, 40-gun) + ' gün')
    + `<div class="optakvim fadein">${hucreler}</div>`

       Bu ekran yalnızca ne olacağını gösterir, tetikleme yapmaz.</div>`;
}

/* ─────────────── LİG TABLOLARI ─────────────── */
async function openLeagues() {
  _opAktif('__ligler__'); _opYukleniyor('Lig Tabloları');
  let takimlar = [], sonuclar = [];
  try { takimlar = (await apiTum({ table:'teams', orderBy:'id', orderDir:'asc' })).rows || []; } catch(e) {}
  try { sonuclar = (await api('list',{ table:'match_results', limit:2000,
        orderBy:'created_at', orderDir:'desc' })).rows || []; } catch(e) {}

  // ülke → tier → takım
  const ulke = {};
  takimlar.forEach(t => {
    const cc = t.country_code || '??';
    const tier = Number(t.tier) || 99;
    (ulke[cc] = ulke[cc] || {})[tier] = (ulke[cc][tier] || []);
    ulke[cc][tier].push(t);
  });

  // puan hesabı (lig maçları)
  const puan = {};
  sonuclar.forEach(m => {
    if (m.tournament_key) return;
    const h = m.home_team, a = m.away_team;
    if (!h || !a) return;
    const hs = Number(m.home_score)||0, as = Number(m.away_score)||0;
    const ek = (ad, p, af, ak) => {
      const o = puan[ad] = puan[ad] || { o:0, p:0, af:0, ak:0 };
      o.o++; o.p += p; o.af += af; o.ak += ak;
    };
    ek(h, hs>as?3:(hs===as?1:0), hs, as);
    ek(a, as>hs?3:(hs===as?1:0), as, hs);
  });

  const kodlar = Object.keys(ulke).sort();
  const blok = kodlar.map(cc => {
    const tierler = Object.keys(ulke[cc]).map(Number).sort((a,b)=>a-b);
    const ic = tierler.map(tr => {
      const liste = ulke[cc][tr].slice().sort((a,b) => {
        const pa = puan[a.name] || {p:0,af:0,ak:0}, pb = puan[b.name] || {p:0,af:0,ak:0};
        return (pb.p-pa.p) || ((pb.af-pb.ak)-(pa.af-pa.ak)) || (pb.af-pa.af);
      });
      const sat = liste.map((t,i) => {
        const p = puan[t.name] || { o:0,p:0,af:0,ak:0 };
        return `<tr><td class="opsag" style="width:32px;color:var(--dim)">${i+1}</td>
          <td>${_fbEsc(t.name)}</td>
          <td class="opsag">${p.o}</td>
          <td class="opsag">${p.af}-${p.ak}</td>
          <td class="opsag" style="color:var(--gold);font-weight:800">${p.p}</td>
          <td class="opsag opmono">${t.team_ovr ?? '—'}</td></tr>`;
      }).join('');
      return `<div class="opbas" style="margin:14px 0 6px">${cc} · Kademe ${tr} <span style="color:var(--dim);font-weight:600">(${liste.length} takım)</span></div>
        <div class="tablewrap"><div class="scroll"><table>
          <thead><tr><th></th><th>Takım</th><th class="opsag">O</th><th class="opsag">A-Y</th>
            <th class="opsag">P</th><th class="opsag">OVR</th></tr></thead>
          <tbody>${sat}</tbody></table></div></div>`;
    }).join('');
    return `<details class="opdet"><summary>${cc} — ${tierler.length} lig, ${
      tierler.reduce((t,x)=>t+ulke[cc][x].length,0)} takım</summary>${ic}</details>`;
  }).join('');

  $('main').innerHTML = _opBaslik('Lig Tabloları', kodlar.length + ' ülke · ' + takimlar.length + ' takım')
    + `<div class="fadein">${blok || '<div class="msg">Takım bulunamadı.</div>'}</div>`
    + `<div class="opnot">Puanlar <b>match_results</b> tablosundaki lig maçlarından hesaplanır.
       Turnuva maçları dahil değildir. Bu ekran salt okumadır.</div>`;
}

const _TRN_ETIKET = { champ:'Championship', elite:'Elite', conv:'Convergence', enc:'EURO Nations Cup' };
const _FAZ_ETIKET = { playoff:'Play-off', po2:'Play-off 2', group:'Grup Aşaması',
  r32:'Son 32', r16:'Son 16', qf:'Çeyrek Final', sf:'Yarı Final', final:'Final' };

async function openTournaments() {
  _opAktif('__turnuva__'); _opYukleniyor('Turnuva Durumu');
  let durum = [], maclar = [];
  try { durum = (await api('list',{ table:'tournament_state', limit:200 })).rows || []; } catch(e) {}
  try { maclar = (await api('list',{ table:'match_state', limit:2000 })).rows || []; } catch(e) {}

  const say = {};
  maclar.forEach(m => {
    if (!m.tournament_key) return;
    const k = m.tournament_key + '|' + m.season;
    const o = say[k] = say[k] || { top:0, bitti:0, canli:0, faz:{} };
    o.top++;
    if (m.status === 'finished') o.bitti++;
    if (m.status === 'running')  o.canli++;
    if (m.tournament_phase) o.faz[m.tournament_phase] = (o.faz[m.tournament_phase]||0)+1;
  });

  const kart = durum.sort((a,b)=>(b.season||0)-(a.season||0)).map(t => {
    const k = t.tournament_key + '|' + t.season;
    const o = say[k] || { top:0, bitti:0, canli:0, faz:{} };
    const fx = t.fixture || {};
    const gruplar = Array.isArray(fx.groups) ? fx.groups.length : 0;
    const fazlar = Object.keys(o.faz).map(f => (_FAZ_ETIKET[f]||f) + ' (' + o.faz[f] + ')').join(' · ');
    return `<div class="opsat" style="align-items:flex-start">
      <div class="opsat-i">${t.tournament_key==='enc'?'🌍':'🏆'}</div>
      <div class="opsat-o">
        <div class="opsat-ad">${_TRN_ETIKET[t.tournament_key]||t.tournament_key} · Sezon ${t.season}</div>
        <div class="opsat-alt">Aşama: <b style="color:var(--txt)">${_FAZ_ETIKET[t.phase]||t.phase||'—'}</b>
          ${gruplar?' · '+gruplar+' grup':''} · ${o.top} maç (${o.bitti} bitti, ${o.canli} canlı)</div>
        ${fazlar?`<div class="opsat-alt" style="margin-top:3px">${fazlar}</div>`:''}
      </div>
      <div class="opsat-s"><span class="oproz ${o.canli?'ok':'oto'}">${o.canli?o.canli+' canlı':'Otomatik'}</span></div>
    </div>`;
  }).join('');

  $('main').innerHTML = _opBaslik('Turnuva Durumu', durum.length + ' kayıt')
    + `<div class="fadein">${kart || '<div class="msg">Turnuva kaydı yok.</div>'}</div>`
    + `<div class="opnot">Turnuva kurulumu ve kura çekimi sezon takvimine göre <b>otomatik</b> çalışır.
       Bu ekran yalnızca durumu gösterir.</div>`;
}

/* ─────────────── GÜNLÜK FİKSTÜR ─────────────── */
let FX_GUN = null;
async function openFixture() {
  _opAktif('__fikstur__'); _opYukleniyor('Günlük Fikstür');
  let maclar = [];
  try { maclar = (await api('list',{ table:'match_state', limit:2000,
        orderBy:'kickoff_at', orderDir:'asc' })).rows || []; } catch(e) {}

  const gunler = {};
  maclar.forEach(m => {
    const g = m.kickoff_at ? String(m.kickoff_at).slice(0,10) : '—';
    (gunler[g] = gunler[g] || []).push(m);
  });
  const sirali = Object.keys(gunler).sort();
  const bugun = new Date().toISOString().slice(0,10);
  if (!FX_GUN || !gunler[FX_GUN]) FX_GUN = gunler[bugun] ? bugun : (sirali[sirali.length-1] || null);

  const secenek = sirali.map(g => `<option value="${g}" ${g===FX_GUN?'selected':''}>${g} (${gunler[g].length})</option>`).join('');
  const liste = (gunler[FX_GUN] || []).map(m => {
    const rz = m.status==='finished' ? '<span class="oproz ok">Bitti</span>'
             : m.status==='running'  ? '<span class="oproz" style="background:rgba(226,59,90,.13);color:#ff8ea3;border:1px solid rgba(226,59,90,.3)">Canlı '+(m.sim_minute||0)+"'</span>"
             : '<span class="oproz oto">Planlı</span>';
    const saat = m.kickoff_at ? String(m.kickoff_at).slice(11,16) : '—';
    const tur  = m.tournament_key ? (_TRN_ETIKET[m.tournament_key]||m.tournament_key) : (m.league_name||'Lig');
    return `<tr><td class="opmono">${saat}</td>
      <td>${_fbEsc(m.home_team||'')}</td>
      <td class="opsag" style="width:54px">${m.status==='scheduled'?'—':(m.home_score??0)+'-'+(m.away_score??0)}</td>
      <td>${_fbEsc(m.away_team||'')}</td>
      <td style="color:var(--dim);font-size:11.5px">${_fbEsc(tur)}</td>
      <td class="opsag">${rz}</td></tr>`;
  }).join('');

  $('main').innerHTML = `<div class="titlebox fadein"><h2>Günlük Fikstür</h2>
      <span class="cnt">${(gunler[FX_GUN]||[]).length} maç</span><div class="sp"></div>
      <select id="fxGun">${secenek}</select></div>
    <div class="tablewrap fadein"><div class="scroll"><table>
      <thead><tr><th>Saat</th><th>Ev</th><th class="opsag">Skor</th><th>Deplasman</th>
        <th>Lig / Turnuva</th><th class="opsag">Durum</th></tr></thead>
      <tbody>${liste || '<tr><td colspan="6">Bu günde maç yok.</td></tr>'}</tbody></table></div></div>
    <div class="opnot">Maç saatleri sunucu tarafından belirlenir. Bu ekran salt okumadır.</div>`;
  const sel = $('fxGun'); if (sel) sel.onchange = () => { FX_GUN = sel.value; openFixture(); };
}

/* ─────────────── ANTRENMAN YARIŞI ─────────────── */
async function openTraining() {
  _opAktif('__antrenman__'); _opYukleniyor('Antrenman Yarışı');
  let up = [], pl = [];
  try { up = (await apiTum({ table:'user_player', orderBy:'user_id', orderDir:'asc' })).rows || []; } catch(e) {}
  try { pl = (await apiTum({ table:'players', orderBy:'user_id', orderDir:'asc' }, _gercekBitti)).rows || []; } catch(e) {}
  const adByUid = {}; pl.forEach(p => { if (p.user_id) adByUid[p.user_id] = p; });

  // Döngü: son Cuma 17:00 UTC
  const now = new Date();
  const d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 17, 0, 0));
  const fark = (d.getUTCDay() - 5 + 7) % 7;
  d.setUTCDate(d.getUTCDate() - fark);
  if (d.getTime() > Date.now()) d.setUTCDate(d.getUTCDate() - 7);
  const dongu = d.getTime();

  const sira = [];
  up.forEach(u => {
    const log = Array.isArray(u.train_log) ? u.train_log : [];
    const bu = log.filter(e => e && Number(e.ts) >= dongu);
    const en = bu.reduce((t,e)=>t+(Number(e.energy)||0),0);
    const p = adByUid[u.user_id];
    sira.push({ ad: (p && p.name) || String(u.user_id||'').slice(0,8),
                takim: (p && p.team_name) || '—', enerji: en, kayit: bu.length, toplam: log.length });
  });
  sira.sort((a,b)=>b.enerji-a.enerji);
  const aktif = sira.filter(x=>x.enerji>0);

  const sat = sira.slice(0,40).map((x,i) => `<tr>
      <td class="opsag" style="width:32px;color:var(--dim)">${i+1}</td>
      <td>${_fbEsc(x.ad)}</td><td style="color:var(--dim)">${_fbEsc(x.takim)}</td>
      <td class="opsag" style="color:${x.enerji?'var(--accent)':'var(--dim)'};font-weight:800">${x.enerji}</td>
      <td class="opsag opmono">${x.kayit}</td>
      <td class="opsag opmono">${x.toplam}</td></tr>`).join('');

  $('main').innerHTML = _opBaslik('Antrenman Yarışı', 'döngü başlangıcı ' + d.toISOString().slice(0,16).replace('T',' ') + ' UTC')
    + `<div class="opgrid fadein">
        ${_opKart('Bu Döngüde', String(aktif.length), 'oyuncu antrenman yaptı', aktif.length?'y':'s')}
        ${_opKart('Toplam Enerji', _fmtSayi(aktif.reduce((t,x)=>t+x.enerji,0)), 'harcanan', 'y')}
        ${_opKart('Kayıtlı Oyuncu', String(up.length), 'user_player satırı', 'y')}
      </div>`
    + `<div class="tablewrap fadein" style="margin-top:12px"><div class="scroll"><table>
        <thead><tr><th></th><th>Oyuncu</th><th>Takım</th><th class="opsag">Enerji</th>
          <th class="opsag">Kayıt</th><th class="opsag">Toplam</th></tr></thead>
        <tbody>${sat || '<tr><td colspan="6">Kayıt yok.</td></tr>'}</tbody></table></div></div>`
    + `<div class="opnot">Yarış her Cuma 17:00 UTC'de sıfırlanır. "Enerji" bu döngüde harcanan,
       "Kayıt" bu döngüdeki antrenman sayısı, "Toplam" tüm zamanların kayıt sayısıdır.
       Bir oyuncunun enerjisi diğerlerinden aşırı yüksekse kayıtları incele.</div>`;
}

/* ─────────────── GÖNDERİ DENETİMİ ─────────────── */
async function openMedia() {
  _opAktif('__medya__'); _opYukleniyor('Gönderi Denetimi');
  let gonderi = [], pl = [];
  try { gonderi = (await api('list',{ table:'social_posts', limit:200,
        orderBy:'created_at', orderDir:'desc' })).rows || []; } catch(e) {}
  try { pl = (await apiTum({ table:'players', orderBy:'user_id', orderDir:'asc' }, _gercekBitti)).rows || []; } catch(e) {}
  const adByUid = {}; pl.forEach(p => { if (p.user_id) adByUid[p.user_id] = p.name; });

  const sat = gonderi.map(g => {
    const yazar = adByUid[g.author_id || g.user_id] || String(g.author_id||g.user_id||'').slice(0,8);
    const zaman = g.created_at ? new Date(g.created_at).toLocaleString('tr') : '—';
    const metin = String(g.body || g.text || g.content || '').slice(0, 220);
    return `<tr>
      <td style="white-space:nowrap">${_fbEsc(yazar)}</td>
      <td style="color:var(--dim);font-size:12px">${_fbEsc(metin)}</td>
      <td class="opmono" style="white-space:nowrap">${zaman}</td>
      <td class="opsag"><button class="btn red" data-gsil="${g.id}">Sil</button></td></tr>`;
  }).join('');

  $('main').innerHTML = _opBaslik('Gönderi Denetimi', gonderi.length + ' gönderi · en yeniler')
    + `<div class="tablewrap fadein"><div class="scroll"><table>
        <thead><tr><th>Yazar</th><th>İçerik</th><th>Zaman</th><th class="opsag">İşlem</th></tr></thead>
        <tbody>${sat || '<tr><td colspan="4">Gönderi yok.</td></tr>'}</tbody></table></div></div>`
    + `<div class="opnot">Silme geri alınamaz. Gönderiye ait beğeni ve yorumlar da erişilemez hale gelir.</div>`;

  $('main').querySelectorAll('button[data-gsil]').forEach(b => b.onclick = async () => {
    if (!confirm('Bu gönderi kalıcı olarak silinecek. Onaylıyor musun?')) return;
    b.disabled = true; b.textContent = '…';
    try { await api('delete', { table:'social_posts', pk:{ id: b.dataset.gsil } });
          b.closest('tr').style.opacity = '.35'; b.textContent = '✓ Silindi'; }
    catch(e) { b.disabled = false; b.textContent = 'Hata'; alert(e.message); }
  });
}

function showLogin(){ var b=$('boot'); if(b) b.style.display='none'; $('app').classList.remove('show'); $('login').style.display='block'; }
async function tryResume(){
  let sess=null; try{ sess=JSON.parse(localStorage.getItem(SESS_KEY)||'null'); }catch(e){}
  if(!sess || !sess.access_token){ showLogin(); return; }
  TOKEN = sess.access_token;
  try { META = (await api('meta')).meta || {}; }
  catch(e){
    if(!sess.refresh_token){ clearSess(); showLogin(); return; }
    try { const d=await refreshSession(sess.refresh_token); TOKEN=d.access_token; saveSess(d); META=(await api('meta')).meta || {}; }
    catch(e2){ clearSess(); showLogin(); return; }
  }
  var b=$('boot'); if(b) b.style.display='none';
  $('login').style.display='none'; $('app').classList.add('show');
  buildNav(); openDash();
}
tryResume();
</script>
