<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Twemoji Country Flags';src:url('https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1.8/dist/TwemojiCountryFlags.woff2') format('woff2');unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0020-E007F;font-weight:100 1000;font-style:normal;font-display:swap}
  :root{
    --bg:#0a0b0e; --panel:#14171d; --panel2:#1a1e26; --line:#262b34;
    --txt:#e7eaf0; --dim:#8a93a3; --accent:#2ec36b; --accent2:#1f9e54;
    --red:#e23b5a; --gold:#ffd54f; --goldln:rgba(255,213,79,.28); --blue:#42a5f5;
    --carbon:repeating-linear-gradient(45deg,#15171c 0,#15171c 2px,#101216 2px,#101216 4px);
    --disp:'Twemoji Country Flags','Barlow Condensed',system-ui,sans-serif;
    --body:'Twemoji Country Flags','Barlow',system-ui,sans-serif;
    --mono:'Twemoji Country Flags',ui-monospace,Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--body); font-size:14px; line-height:1.4; color:var(--txt);
    background:var(--bg) radial-gradient(1200px 600px at 80% -10%, #16191f 0, transparent 60%); }
  button{ font-family:var(--disp); cursor:pointer; border:none; border-radius:9px; letter-spacing:.4px; }
  input,select,textarea{ font-family:var(--body); background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:9px; padding:8px 11px; outline:none; }
  input:focus,select:focus,textarea:focus{ border-color:var(--goldln); }
  textarea{ width:100%; min-height:96px; resize:vertical; font-family:var(--mono); font-size:12px; }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:#2a2f3a; border-radius:6px; }

  .carbon{ background-image:var(--carbon); border:1px solid var(--goldln); border-radius:12px; }
  .disp{ font-family:var(--disp); }

  /* Giriş */
  #login{ max-width:360px; margin:13vh auto; padding:30px 26px 26px; }
  #login .logo{ width:74px; height:74px; border-radius:16px; display:block; margin:0 auto 14px; box-shadow:0 6px 24px rgba(210,35,47,.35); }
  #login h1{ font-family:var(--disp); font-weight:900; font-size:26px; text-align:center; margin:0; letter-spacing:.5px; }
  #login h1 span{ color:var(--gold); }
  #login p{ text-align:center; color:var(--dim); font-size:13px; margin:2px 0 20px; }
  #login input{ width:100%; margin-bottom:11px; }
  #login button{ width:100%; padding:12px; font-weight:800; font-size:16px; color:#06210f;
    background:linear-gradient(180deg,var(--accent),var(--accent2)); border:1px solid #36d27c; }
  #login button:hover{ filter:brightness(1.06); }
  #loginErr{ color:var(--red); font-size:13px; min-height:18px; margin-top:8px; text-align:center; }

  /* Uygulama */
  #app{ display:none; }
  #app.show{ display:grid; grid-template-columns:236px 1fr; height:100vh; }
  #side{ background-image:var(--carbon); border-right:1px solid var(--goldln); overflow:auto; padding:12px 10px; }
  #brand{ display:flex; align-items:center; gap:9px; padding:6px 8px 14px; }
  #brand img{ width:30px; height:30px; border-radius:8px; }
  #brand b{ font-family:var(--disp); font-weight:900; font-size:17px; letter-spacing:.5px; }
  #brand b span{ color:var(--gold); }
  #nav{ margin-bottom:6px; }
  .cathead{ display:flex; align-items:center; width:100%; text-align:left; background:transparent; color:var(--gold);
    font-family:var(--disp); font-weight:800; font-size:13px; letter-spacing:.6px; text-transform:uppercase;
    padding:9px 10px; border-radius:8px; border:1px solid transparent; transition:.12s; cursor:pointer; }
  .cathead:hover{ background:#1b1f27; }
  .cathead .chev{ margin-left:auto; transition:transform .15s; opacity:.65; }
  .cat.open > .cathead{ color:#fff; }
  .cat.open > .cathead .chev{ transform:rotate(90deg); opacity:1; }
  .subwrap{ display:none; padding:2px 0 8px 8px; }
  .cat.open > .subwrap{ display:block; }
  .sub{ display:block; width:100%; text-align:left; background:transparent; color:var(--dim);
    font-family:var(--body); font-size:13.5px; font-weight:600; padding:7px 10px; border-radius:8px; margin-bottom:2px;
    border:1px solid transparent; border-left:2px solid #2a2f3a; transition:.12s; }
  .sub:hover{ background:#1b1f27; color:var(--txt); border-left-color:var(--goldln); }
  .sub.active{ color:#fff; background:linear-gradient(180deg,rgba(46,195,107,.26),rgba(31,158,84,.14)); border-color:#2ec36b; border-left-color:#2ec36b; }
  .soon{ color:#5c6470; font-size:12px; font-style:italic; padding:5px 10px 5px 12px; }

  /* ═══ 🆕 OPERASYON / SEZON / EKONOMİ — mevcut üslupla aynı ═══ */
  .opgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:11px; margin-bottom:6px; }
  .opk{ background-image:var(--carbon); border:1px solid var(--line); border-radius:12px; padding:13px 14px; }
  .opk-l{ font-size:11px; color:var(--dim); letter-spacing:.4px; text-transform:uppercase; font-weight:700; }
  .opk-v{ font-family:var(--disp); font-size:26px; font-weight:900; line-height:1.15; margin-top:3px; }
  .opk-a{ font-size:11px; color:var(--dim); margin-top:2px; }
  .opbas{ font-family:var(--disp); font-size:14px; font-weight:800; letter-spacing:.5px;
    color:var(--dim); text-transform:uppercase; margin:20px 0 9px; }
  .opsat{ display:flex; align-items:center; gap:12px; padding:12px 13px; border:1px solid var(--line);
    border-radius:11px; background:var(--panel2); margin-bottom:9px; }
  .opsat-i{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center;
    justify-content:center; font-size:16px; background:rgba(255,255,255,.04); flex-shrink:0; }
  .opsat-o{ flex:1; min-width:0; }
  .opsat-ad{ font-weight:700; font-size:13.5px; }
  .opsat-alt{ font-size:11.5px; color:var(--dim); margin-top:1px; }
  .opsat-s{ flex-shrink:0; }
  .oproz{ font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase;
    border-radius:5px; padding:3px 9px; white-space:nowrap; display:inline-block; }
  .oproz.oto{ background:rgba(66,165,245,.13); color:var(--blue); border:1px solid rgba(66,165,245,.3); }
  .oproz.ok{ background:rgba(46,195,107,.13); color:var(--accent); border:1px solid rgba(46,195,107,.3); }
  .opnot{ margin-top:16px; border:1px solid var(--line); background:var(--panel2); border-radius:11px;
    padding:12px 13px; font-size:12px; color:var(--dim); line-height:1.7; }
  .opnot b{ color:var(--txt); }
  .opmono{ font-family:var(--mono); font-size:11px; color:var(--dim); }
  .opsag{ text-align:right; }
  .optakvim{ display:grid; grid-template-columns:repeat(10,1fr); gap:5px; }
  @media(max-width:640px){ .optakvim{ grid-template-columns:repeat(5,1fr); } }
  .opgun{ aspect-ratio:1; border-radius:8px; border:1px solid var(--line); background:var(--panel2);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:10px; color:var(--dim); overflow:hidden; padding:2px; }
  .opgun b{ font-family:var(--disp); font-size:13px; color:var(--txt); font-weight:800; line-height:1; }
  .opgun small{ font-size:8px; opacity:.85; margin-top:2px; text-align:center; line-height:1.1; }
  .opgun.lig{ border-color:rgba(46,195,107,.35); background:rgba(46,195,107,.06); }
  .opgun.trn{ border-color:var(--goldln); background:rgba(255,213,79,.06); }
  .opgun.enc{ border-color:rgba(66,165,245,.35); background:rgba(66,165,245,.06); }
  .opgun.bugun{ outline:2px solid var(--accent); outline-offset:1px; }
  .oplej{ display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:11px; color:var(--dim); }
  .oplej i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  /* ── ZİYARET & AKTİFLİK ÖZETİ ── */
  .cvbox{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:14px; }
  .cvhead{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:13px; }
  .cvhead h3{ font-family:var(--disp); font-size:20px; font-weight:900; letter-spacing:.5px; margin:0; }
  .cvhead .cvsub{ font-size:11px; color:var(--dim); margin-top:2px; }
  .cvcanli{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); }
  .cvnokta{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); animation:cvyanip 1.6s ease-in-out infinite; }
  @keyframes cvyanip{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }
  .cvliste{ margin-top:12px; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .cvliste-bas{ padding:8px 12px; font-size:10px; letter-spacing:.7px; text-transform:uppercase; color:var(--dim);
    background:var(--panel2); border-bottom:1px solid var(--line); font-weight:800; }
  .cvsat{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); font-size:13px; }
  .cvsat:last-child{ border-bottom:none; }
  .cvsat .cvad{ flex:1; min-width:0; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cvsat .cvsure{ font-size:11px; color:var(--dim); flex-shrink:0; }
  .cvbos{ padding:14px 12px; color:var(--dim); font-size:13px; }
  .cvtumu{ display:flex; width:100%; align-items:center; justify-content:center; gap:6px; padding:10px 12px; border:0; background:var(--panel2);
    color:var(--accent); font-family:var(--disp); font-weight:800; font-size:13px; letter-spacing:.6px; text-transform:uppercase; cursor:pointer; }
  .cvtumu:hover{ background:#1f2430; }
  .cvtumu:disabled{ color:var(--dim); cursor:default; }
  .cvtumu svg{ width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; transition:transform .18s; }
  .cvtumu.acik svg{ transform:rotate(180deg); }

  /* ── ELMAS SATIŞLARI ── */
  .od-ust{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:13px; }
  .od-not{ font-size:11px; color:var(--dim); margin-top:3px; }

// API
// 729 — tablonun tamamını sayfa sayfa okur (sunucu tek istekte sınırlı satır döndürür); durdur(satırlar) true dönerse biter
async function apiTum(p, durdur) {
  const out = [];
  for (let off = 0, tur = 0; tur < 200; tur++) {
    const r = await api('list', Object.assign({}, p, { limit: 1000, offset: off }));
    const rows = (r && r.rows) || [];
    if (!rows.length) break;
    out.push(...rows); off += rows.length;
    if (durdur && durdur(rows)) break;
  }
  return { rows: out };
}
// Gerçek kullanıcılar user_id sırasında önce gelir (botlarda user_id boş, sona düşer): bota gelince durulur
const _gercekBitti = rows => rows.some(x => !x.user_id);

async function api(op, payload={}) {
  const r = await fetch(GATEWAY, {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+TOKEN, 'apikey':CFG.anon, 'Content-Type':'application/json' },
    body: JSON.stringify({ op, ...payload })
  });
  const d = await r.json().catch(()=>({ ok:false, error:'Yanıt okunamadı' }));
  if (!d.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}

  if (!email || !password) { $('loginErr').textContent='E-posta ve şifre gir.'; return; }

    const r = await fetch(CFG.url+'/auth/v1/token?grant_type=password', {
      method:'POST', headers:{ 'apikey':CFG.anon, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password })
    });

    if (!r.ok || !d.access_token) throw new Error(d.error_description || d.msg || d.error || 'Giriş başarısız');

// Şikayet edilen hesap: "Şikayet edilen: Ad (kimlik)" — kimlik hesap kimliği ya da CSC Media adı (user:<ad>)
function fbSikayetHedef(m){
  m=String(m||''); if(m.indexOf('[İçerik şikayeti]')!==0) return null;
  const k=m.match(/^Şikayet edilen: .*\(([^()]+)\)\s*$/m); return k?k[1].trim():null;

function fbProfil(hedef){
  if(!hedef||!FB_PROFIL) return null;

  if(k){ const ad=k[1].replace(/^@+/,'').toLowerCase(); return FB_PROFIL.find(p=>String(p.username||'').replace(/^@+/,'').toLowerCase()===ad)||null; }

    ${fbKonusmaHtml(gor)}
    ${acik ? `<div class="fbcvp"><textarea id="fbCvpMetin" maxlength="4000" placeholder="${FB_EK ? 'Ek mesajın…' : 'Oyuncuya cevabın…'}">${_fbEsc(cvpMetin)}</textarea>
      <div class="b"><button class="btn" data-fbv="1">Vazgeç</button><button class="btn green" data-fbg="${f.id}">Gönder</button></div></div>` : ''}
    <div class="foot">
      ${fbKimHtml(f)}
      <span class="acts">
        ${fbSikayetHedef(f.message) ? `<button class="btn islem" data-fbi="${f.id}">İşlem Yap</button>` : ''}
        ${acik ? '' : `<button class="btn green" data-fbr="${f.id}">${cvpEtiket}</button>`}
        ${acik || cvpEtiket !== 'Cevabı Düzenle' ? '' : `<button class="btn green" data-fbek="${f.id}">Ek Mesaj</button>`}
        ${st!=='okundu'?`<button class="btn" data-fbs="okundu" data-id="${f.id}">Okundu</button>`:''}
        ${st!=='cozuldu'?`<button class="btn gold" data-fbs="cozuldu" data-id="${f.id}">Çözüldü</button>`:''}
        <button class="btn red" data-fbd="${f.id}">Sil</button>
      </span>
    </div>
  </div>`;
}

function renderFeedback(){
  const area = $('fbArea'); if(!area) return;
  const sayfa = area.classList.contains('fbsayfa');
  const cozuldu = f => (f.status||'yeni') === 'cozuldu';
  const ssay = { aktif:FB_DATA.filter(f=>!cozuldu(f)).length, cozuldu:FB_DATA.filter(cozuldu).length };
  const kaynak = sayfa ? FB_DATA : FB_DATA.filter(f => cozuldu(f) === (FB_SEKME === 'cozuldu'));
  const counts = { all:kaynak.length, sikayet:0, istek:0, talep:0 };
  const dsay = { all:FB_DATA.length, yeni:0, okundu:0, cozuldu:0 };
  kaynak.forEach(f=>{ if(counts[f.type]!==undefined) counts[f.type]++; });
  FB_DATA.forEach(f=>{ const st=f.status||'yeni'; if(dsay[st]!==undefined) dsay[st]++; });
  const chip = (k,lbl)=>`<button class="chip ${FB_FILTER===k?'active':''}" data-f="${k}">${lbl} (${counts[k]||0})</button>`;
  const dchip = (k,lbl)=>`<button class="chip ${FB_DURUM===k?'active':''}" data-d="${k}">${lbl} (${dsay[k]||0})</button>`;
  const sekme = (k,lbl)=>`<button class="${FB_SEKME===k?'on':''}" data-sk="${k}">${lbl}<b>${ssay[k]}</b></button>`;
  const items = kaynak.filter(f => (FB_FILTER==='all' || f.type===FB_FILTER) && (!sayfa || FB_DURUM==='all' || (f.status||'yeni')===FB_DURUM));
  const head = `<div class="fbhead">${sayfa?'':`<h2>Geri Bildirimler</h2><div class="fbsekme">${sekme('aktif','Aktif')}${sekme('cozuldu','Çözüldü')}</div><div class="sp"></div>`}
    ${chip('all','Tümü')}${chip('sikayet','Şikayet')}${chip('istek','İstek')}${chip('talep','Talep')}
    ${sayfa?`<span class="ayrac"></span>${dchip('yeni','Yeni')}${dchip('okundu','Okundu')}${dchip('cozuldu','Çözüldü')}`:''}</div>`;
  const list = items.length
    ? `<div class="fblist">${items.map(fbItemHtml).join('')}</div>`
    : '<div class="fbempty">Bu kategoride geri bildirim yok.</div>';
  area.innerHTML = head + list;
  const cnt = $('fbCnt'); if(cnt) cnt.textContent = dsay.yeni + ' yeni · ' + FB_DATA.length + ' kayıt';
  area.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{ FB_FILTER=c.dataset.f; renderFeedback(); });
  area.querySelectorAll('[data-sk]').forEach(c=>c.onclick=()=>{ FB_SEKME=c.dataset.sk; renderFeedback(); });
  area.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{ FB_DURUM=(FB_DURUM===c.dataset.d)?'all':c.dataset.d; renderFeedback(); });
  area.querySelectorAll('[data-fbs]').forEach(b=>b.onclick=()=>fbStatus(b.dataset.id, b.dataset.fbs));
  area.querySelectorAll('[data-fbd]').forEach(b=>b.onclick=()=>fbDelete(b.dataset.fbd));
  area.querySelectorAll('[data-fbek]').forEach(b=>b.onclick=()=>{ FB_CEVAP=b.dataset.fbek; FB_EK=true; renderFeedback(); const t=$('fbCvpMetin'); if(t) t.focus(); });
  area.querySelectorAll('[data-fbr]').forEach(b=>b.onclick=()=>{ FB_CEVAP=b.dataset.fbr; FB_EK=false; renderFeedback(); const t=$('fbCvpMetin'); if(t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); } });
  area.querySelectorAll('[data-fbv]').forEach(b=>b.onclick=()=>{ FB_CEVAP=null; FB_EK=false; renderFeedback(); });
  area.querySelectorAll('[data-fbg]').forEach(b=>b.onclick=()=>fbReply(b.dataset.fbg));
  area.querySelectorAll('[data-fbi]').forEach(b=>b.onclick=()=>fbIslem(b.dataset.fbi));
  area.querySelectorAll('[data-fbu]').forEach(b=>b.onclick=async()=>{ const ad=b.dataset.fbu; await openUsers(); const i=$('uSval'); if(i){ i.value=ad; uOnSearch(); } });
}

// Cevap oyuncunun gelen kutusuna sistem mesajı olarak düşer (oyun açıksa hemen)
async function fbReply(id){
  const metin = String(($('fbCvpMetin')||{}).value||'').trim();
  if (!metin) { $('fbCvpMetin').focus(); return; }
  const f = FB_DATA.find(x=>String(x.id)===String(id));
  const th = f ? fbKonusma(f) : [];
  try {
    // 685 — cevap talebi "Çözüldü" yapmaz (Okundu olur); Çözüldü'yü yönetici elle verir ve sohbet kapanır.
    //   Cevap düzenlemek durumu değiştirmez.
    if (FB_EK) {
      // 743 — ek mesaj aynı konuşmanın sonuna eklenir; durum yazımı oyuncunun açık oyununa haber verir (yeni cevap)
      await fbRpc('destek_yonetim_cevap', { p_id:String(id), p_metin:metin, p_duzenle:false });
      await api('update', { table:'feedback', pk:{ id }, values:{ status: (f && f.status === 'cozuldu') ? 'cozuldu' : 'okundu' } });
    } else if (th.length) {
      // 683 — oyuncu cevap verdiyse yeni cevap konuşmaya eklenir; son mesaj bizimse düzenlenir
      const duzenle = th[th.length-1].k==='yonetim';
      await fbRpc('destek_yonetim_cevap', { p_id:String(id), p_metin:metin, p_duzenle: duzenle });
      // Gateway üzerinden durum yazımı: oyuncunun açık oyununa haber gider
      await api('update', { table:'feedback', pk:{ id }, values:{ status: duzenle ? ((f && f.status) || 'okundu') : 'okundu' } });
    } else {
      await api('update', { table:'feedback', pk:{ id },
        values:{ reply: metin, replied_at: new Date().toISOString(), status: (f && f.reply) ? ((f.status) || 'okundu') : 'okundu' } });
    }
    FB_CEVAP = null; FB_EK = false;
    loadFeedback();
  } catch(e){
    const M = { oyuncu_cevabi_yok:'Oyuncu henüz cevap vermedi; son cevabını düzenleyebilirsin.', duzenlenecek_cevap_yok:'Düzenlenecek cevap yok.',
                yetki_yok:'Bu işlem için yönetici yetkisi gerekiyor.', talep_yok:'Talep bulunamadı; silinmiş olabilir.' };
    const k = Object.keys(M).find(x => String(e.message||'').indexOf(x) !== -1);
    alert('Cevap kaydedilemedi: ' + (k ? M[k] : e.message));
  }
}
async function fbRpc(ad, args){
  const r = await fetch(CFG.url + '/rest/v1/rpc/' + ad, { method:'POST',
    headers:{ 'apikey':CFG.anon, 'Authorization':'Bearer '+TOKEN, 'Content-Type':'application/json' }, body: JSON.stringify(args) });
  const d = await r.json().catch(()=>null);
  if (!r.ok) throw new Error((d && (d.message || d.hint)) || ('HTTP '+r.status));
  return d;
}

async function fbStatus(id, status){
  try { await api('update', { table:'feedback', pk:{ id }, values:{ status } }); loadFeedback(); }
  catch(e){ alert('Güncellenemedi: '+e.message); }
}
async function fbDelete(id){
  if(!confirm('Bu geri bildirimi silmek istediğine emin misin?')) return;
  try { await api('delete', { table:'feedback', pk:{ id } }); loadFeedback(); }
  catch(e){ alert('Silinemedi: '+e.message); }
}


/* ═══════════════════════════════════════════════════════════════════
   ELMAS SATIŞLARI — Google Play · App Store · Xsolla ödeme raporu

   Kaynak: `payments` tablosu. Her satır bir ödeme.
   654 — tutarlar TL: müşterinin ödediği tutar (vergi dahil) ve ödeme gününün kuruyla TL karşılığı
   sunucuda yazılır (tutar, para_birimi, kur, tl). `eur` yalnız paketin liste fiyatı, gösterilmez.
   TL'si henüz hesaplanmamış ödeme toplama girmez, "bekliyor" sayılır.
   Test (sandbox) kayıtları varsayılan olarak GİZLİ — ciroyu kirletmesin.
   ═══════════════════════════════════════════════════════════════════ */
const OD_DONEM = [
  { k:'bugun', ad:'Bugün'    },
  { k:'hafta', ad:'Bu Hafta' },
  { k:'ay',    ad:'Bu Ay'    },
  { k:'yil',   ad:'Bu Yıl'   },
  { k:'tumu',  ad:'Tümü'     }
];
let OD_SECILI  = 'ay';
let OD_LISTE   = [];      // payments satırları
let OD_ISIM    = {};      // user_id -> {ad, takim}
let OD_KISI    = null;    // açık olan alıcı (null = liste)
let OD_TEST    = false;   // sandbox kayıtları görünsün mü

function _odBaslangic(k){
  const d = new Date();
  if (k === 'bugun'){ d.setHours(0,0,0,0); return d.getTime(); }
  if (k === 'hafta'){
    const g = (d.getDay() + 6) % 7;          // Pazartesi = 0
    d.setDate(d.getDate() - g); d.setHours(0,0,0,0); return d.getTime();
  }
  if (k === 'ay')  return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  if (k === 'yil') return new Date(d.getFullYear(), 0, 1).getTime();
  return 0;
}
function _odMs(t){ if(!t) return 0; const x = new Date(t).getTime(); return isNaN(x) ? 0 : x; }
function _odTarih(t){
  try { return new Date(t).toLocaleString('tr', { day:'2-digit', month:'2-digit', year:'numeric',
                                                 hour:'2-digit', minute:'2-digit' }); }
  catch(e){ return '—'; }
}
function _odPara(n){ return (Number(n)||0).toLocaleString('tr', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' TL'; }
const OD_KAYNAK = [ ['google_play','Google Play'], ['apple','App Store'], ['xsolla','Xsolla'] ];
function _odKaynakAd(k){ const x = OD_KAYNAK.find(a => a[0] === k); return x ? x[1] : (k || '—'); }
function _odTl(x){ return (x.tl != null) ? Number(x.tl) || 0 : 0; }

async function _odVeriCek(){
  const [pay, pl] = await Promise.all([
    apiTum({ table:'payments', orderBy:'created_at', orderDir:'desc' }),
    apiTum({ table:'players', orderBy:'user_id', orderDir:'asc', cols:'user_id,name,team_name', sayim:'yok' }, _gercekBitti).catch(()=>({rows:[]}))
  ]);
  OD_LISTE = pay.rows || [];
  OD_ISIM = {};
  (pl.rows||[]).forEach(x => {
    if (x && x.user_id) OD_ISIM[x.user_id] = { ad: x.name || '(isimsiz)', takim: x.team_name || '' };
  });
}

function _odSuzulmus(){
  const bas = _odBaslangic(OD_SECILI);
  return OD_LISTE.filter(x =>
    _odMs(x.created_at) >= bas && (OD_TEST || x.sandbox !== true)
  );
}

async function openPayments(){
  _opTemizle();
  $('nav').querySelectorAll('.sub').forEach(b => b.classList.toggle('active', b.dataset.t === '__odeme__'));
  const act = $('nav').querySelector('.sub.active'); if (act) act.closest('.cat').classList.add('open');
  $('main').innerHTML = _opBaslik('Elmas Satışları','yükleniyor…') + '<div class="msg">Yükleniyor…</div>';
  try { await _odVeriCek(); }
  catch(e){
    $('main').innerHTML = _opBaslik('Elmas Satışları','hata')
      + '<div class="opnot" style="border-color:rgba(226,59,90,.35);color:#ff8ea3">'
      + _rkEsc(e.message) + '<br><br>Tablo yeni oluşturulduysa <b>çıkış yapıp tekrar giriş yap</b>.</div>';
    return;
  }
  OD_KISI = null;
  odCiz();
}

function odCiz(){
  if (OD_KISI) return odKisiCiz();

  const kayit  = _odSuzulmus();
  const gecerli = kayit.filter(x => x.status !== 'refunded');
  const iade    = kayit.filter(x => x.status === 'refunded');

  const ciro   = gecerli.reduce((t,x)=>t+_odTl(x),0);
  const elmas  = gecerli.reduce((t,x)=>t+(Number(x.dia)||0),0);
  const iadeTL = iade.reduce((t,x)=>t+_odTl(x),0);
  const kaynakKart = ([k, ad]) => {
    const l = gecerli.filter(x => x.provider === k);
    const bekleyen = l.filter(x => x.tl == null && x.sandbox !== true).length;
    return _opKart(ad.toLocaleUpperCase('tr'), _odPara(l.reduce((t,x)=>t+_odTl(x),0)),
      l.length + ' işlem' + (bekleyen ? ' · ' + bekleyen + ' bekliyor' : ''));
  };

  // Alıcıya göre grupla
  const kisi = {};
  kayit.forEach(x => {
    const k = kisi[x.user_id] = kisi[x.user_id] || {
      uid:x.user_id, adet:0, ciro:0, elmas:0, iade:0, son:0
    };
    k.adet++;
    if (x.status === 'refunded') { k.iade += _odTl(x); }
    else { k.ciro += _odTl(x); k.elmas += Number(x.dia)||0; }
    k.son = Math.max(k.son, _odMs(x.created_at));
  });
  const liste = Object.values(kisi).sort((a,b)=> b.ciro - a.ciro);
  const donemAd = (OD_DONEM.find(d=>d.k===OD_SECILI)||{}).ad || '';

  $('main').innerHTML = _opBaslik('Elmas Satışları', kayit.length + ' işlem · ' + liste.length + ' alıcı')
    + '<div class="bcbox fadein" style="padding:14px 15px">'
      + '<div class="od-ust">'
        + '<div><div class="rk-sure-btns" id="odBtns">'
          + OD_DONEM.map(d=>`<button data-k="${d.k}" class="${d.k===OD_SECILI?'on':''}">${d.ad}</button>`).join('')
        + '</div><div class="od-not">Seçili dönem: <b>' + donemAd + '</b></div></div>'
        + '<label class="od-sw"><input type="checkbox" id="odTest"' + (OD_TEST?' checked':'') + '>'
        + 'Test (sandbox) kayıtlarını da göster</label>'
      + '</div>'
      + '<div class="rk-ozet">'
        + OD_KAYNAK.map(kaynakKart).join('')
        + _opKart('TOPLAM',        _odPara(ciro),  donemAd.toLowerCase(), 's')
      + '</div>'
      + '<div class="rk-ozet" style="margin-bottom:0">'
        + _opKart('SATILAN ELMAS', _fmtSayi(elmas), gecerli.length + ' işlem')
        + _opKart('ALICI',         liste.length,    'farklı kişi')
        + _opKart('İADE',          _odPara(iadeTL), iade.length + ' işlem', iade.length?'k':'')
      + '</div>'
    + '</div>'
    + (liste.length
        ? liste.map(k => {
            const bilgi = OD_ISIM[k.uid] || {};
            return `<div class="rk-firma" onclick="odKisiAc('${k.uid}')">
              <div class="rk-firma-o">
                <div class="rk-firma-ad">${_rkEsc(bilgi.ad || k.uid.slice(0,8))}</div>
                <div class="rk-firma-alt">${bilgi.takim ? _rkEsc(bilgi.takim) + ' · ' : ''}${k.adet} işlem · son: ${_odTarih(k.son)}</div>
              </div>
              <div class="rk-mini">
                <div><div class="v" style="color:var(--gold)">${_odPara(k.ciro)}</div><div class="l">Ödediği</div></div>
                <div><div class="v">${_fmtSayi(k.elmas)}</div><div class="l">Elmas</div></div>
              </div>
            </div>`;
          }).join('')
        : '<div class="opnot">Bu dönemde satış yok.</div>')
    + '<div class="opnot">Bir alıcıya dokun → tarih, saat, kaynak, paket ve işlem numarasıyla '
      + 'tüm ödemelerini gör. İşlem numarasına tıklayınca panoya kopyalanır — '
      + 'Google Play Console, App Store Connect ya da Xsolla panelinde arattığında dekonta ulaşırsın.</div>';

  const b = $('odBtns');
  if (b) b.querySelectorAll('button').forEach(x => x.onclick = () => { OD_SECILI = x.dataset.k; odCiz(); });
  const t = $('odTest');
  if (t) t.onchange = () => { OD_TEST = t.checked; odCiz(); };
}

function odKisiAc(uid){ OD_KISI = uid; odCiz(); }
function odGeri(){ OD_KISI = null; odCiz(); }

function odKisiCiz(){
  const bilgi = OD_ISIM[OD_KISI] || {};
  const kayit = _odSuzulmus().filter(x => x.user_id === OD_KISI)
                  .sort((a,b)=> _odMs(b.created_at) - _odMs(a.created_at));
  const gecerli = kayit.filter(x => x.status !== 'refunded');
  const ciro  = gecerli.reduce((t,x)=>t+_odTl(x),0);
  const elmas = gecerli.reduce((t,x)=>t+(Number(x.dia)||0),0);
  const donemAd = (OD_DONEM.find(d=>d.k===OD_SECILI)||{}).ad || '';

  $('main').innerHTML = _opBaslik(bilgi.ad || OD_KISI.slice(0,8), (bilgi.takim||'') + ' · ' + donemAd)
    + '<div style="display:flex;gap:8px;margin-bottom:14px">'
      + '<button class="btn" onclick="odGeri()">‹ Alıcılar</button>'
    + '</div>'
    + '<div class="rk-ozet">'
      + _opKart('ÖDEDİĞİ',       _odPara(ciro),   donemAd.toLowerCase(), 's')
      + _opKart('ALDIĞI ELMAS',  _fmtSayi(elmas), gecerli.length + ' işlem')
      + _opKart('KULLANICI NO',  OD_KISI.slice(0,8), 'auth kimliği')
    + '</div>'
    + '<div class="od-tablo"><table>'
      + '<tr><th>Tarih &amp; Saat</th><th>Kaynak</th><th>Paket</th><th>Tutar</th><th>Elmas</th>'
      +     '<th>Durum</th><th>İşlem No</th></tr>'
      + kayit.map(x => {
          const iade = x.status === 'refunded';
          return `<tr>
            <td>${_odTarih(x.created_at)}</td>
            <td>${_rkEsc(_odKaynakAd(x.provider))}</td>
            <td>${_rkEsc(x.sku||'—')}</td>
            <td class="od-para"${x.tl_hata ? ` title="${_rkEsc(x.tl_hata)}"` : ''}>${x.tl != null ? _odPara(x.tl) : '—'}${
              (x.para_birimi && x.para_birimi !== 'TRY')
                ? `<small class="od-yerel">${Number(x.tutar).toLocaleString('tr', { maximumFractionDigits:2 })} ${_rkEsc(x.para_birimi)}</small>` : ''}</td>
            <td>${_fmtSayi(x.dia)}</td>
            <td><span class="od-rozet ${iade?'od-iade':'od-ok'}">${iade?'İADE':'ÖDENDİ'}</span>
                ${x.sandbox ? ' <span class="od-rozet od-test">TEST</span>' : ''}</td>
            <td><span class="od-txn" title="Kopyalamak için tıkla"
                      onclick="odKopyala('${_rkEsc(x.txn_id)}', this)">${_rkEsc(x.txn_id)}</span></td>
          </tr>`;
        }).join('')
    + '</table></div>'
    + (kayit.length ? '' : '<div class="opnot">Bu dönemde işlem yok.</div>');
}

function odKopyala(txn, el){
  try {
    navigator.clipboard.writeText(txn);
    const eski = el.textContent;
    el.textContent = 'kopyalandı ✓';
    setTimeout(()=>{ el.textContent = eski; }, 1200);
  } catch(e) {}
}

/* ═══════════════════════════════════════════════════════════════════
   ZİYARET & AKTİFLİK ÖZETİ  (Özet sayfasının üstünde)

   Veri kaynağı:
     • players.last_seen  → oyuncunun oyuna en son girdiği an
     • profiles.created_at → hesabın açıldığı an

   ⚠️ ÖNEMLİ: `last_seen` yalnızca SON girişi tutar, gün gün geçmiş
   tutmaz. Bu yüzden "7 gün" seçilince gösterilen sayı, "son 7 günde
   en az bir kez giren farklı kişi" (yani WAU) demektir — sektörde
   kullanılan ölçü budur. Gün gün grafik istersen ayrı bir kayıt
   tablosu gerekir; şu an öyle bir tablo yok, uydurma veri de
   göstermiyoruz.
   ═══════════════════════════════════════════════════════════════════ */
const CV_DONEM = [
  { k:'bugun',  ad:'Bugün'   },
  { k:'7',      ad:'7 Gün'   },
  { k:'30',     ad:'30 Gün'  },
  { k:'yil',    ad:'Bu Yıl'  },
  { k:'tumu',   ad:'Tümü'    }
];
let CV_SECILI = 'tumu';   // 718 — varsayılan: Tümü
let CV_VERI   = null;   // 729 — { ozet:{…sayılar}, canli:[şu an oyunda, en çok 25] } — sayım veritabanında
let CV_ZAMAN  = null;
let CV_TUMU   = false;   // 732 — "Şu an oyunda" listesi açık mı (kapalıyken ilk 5)

function _cvMs(t){ if(!t) return 0; const x = new Date(t).getTime(); return isNaN(x) ? 0 : x; }
function _cvGecen(ms){
  const f = Date.now() - ms;
  if (f < 60000)   return Math.max(1, Math.round(f/1000)) + ' sn önce';
  if (f < 3600000) return Math.round(f/60000) + ' dk önce';
  if (f < 86400000)return Math.round(f/3600000) + ' saat önce';
  return Math.round(f/86400000) + ' gün önce';
}

async function cvVeriCek(){

    api('list', { table:'admin_aktiflik', limit:1, sayim:'yok' }),
    CV_TUMU ? apiTum({ table:'admin_cevrimici', orderBy:'last_seen', orderDir:'desc', sayim:'yok' })

}

        </div>
      </div>
    </div>

    <div class="rk-ozet">
      ${_opKart('ŞU AN OYUNDA', suAn, 'son 5 dakika')}
      ${_opKart('SON 1 SAAT',   sonSaat,     'giriş yapan kişi', 's')}
      ${_opKart('AKTİF KULLANICI', aktif,    donemAd.toLowerCase() + ' içinde giren')}

      ${_opKart('TOPLAM KAYITLI', toplam, 'hesap')}

             <span class="cvsure">${_cvGecen(_cvMs(p.last_seen))}</span>

      ${suAn > 5 ? `<button type="button" class="cvtumu${CV_TUMU ? ' acik' : ''}" id="cvTumu">${CV_TUMU ? 'Daha az göster' : `Tümünü göster (${suAn.toLocaleString('tr')})`}<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>` : ''}
    </div>

    <div class="opnot" style="margin-top:12px">
      <b>Nasıl okunur:</b> "Aktif kullanıcı", seçili dönemde <b>en az bir kez</b>
      oyuna giren farklı kişi sayısıdır. Oyun açıkken oyuncunun
      <code>son_aktif</code> damgası tazelenir.<br>
      <b>Sınır:</b> <code>son_aktif</code> yalnızca <b>son</b> girişi tutuyor,
      gün gün geçmiş tutmuyor. Bu yüzden "12 Ağustos'ta kaç kişi girdi"
      gibi geçmişe dönük gün grafiği çıkarılamıyor. İstersen günlük giriş
      kaydı tutan küçük bir tablo ekleyebiliriz — kişi başına günde tek
      satır, Supabase'i yormaz.
    </div>
  </div>`;

  const btns = document.getElementById('cvBtns');
  if (btns) btns.querySelectorAll('button').forEach(b => b.onclick = () => {
    CV_SECILI = b.dataset.k; cvCiz();
  });
  const tumu = document.getElementById('cvTumu');
  if (tumu) tumu.onclick = async () => {
    CV_TUMU = !CV_TUMU;
    if (!CV_TUMU) { cvCiz(); return; }

    try { await cvVeriCek(); } catch (e) {}

let CV_TIK = null;
function cvBasla(){
  if (CV_TIK) { clearInterval(CV_TIK); CV_TIK = null; }
  cvCiz();
  cvVeriCek().then(cvCiz).catch(()=>{
    const alan = document.getElementById('cvArea');
    if (alan) alan.innerHTML = '<div class="cvbox"><div class="cvbos">Ziyaret özeti okunamadı.</div></div>';
  });
  CV_TIK = setInterval(() => {
    // Özet sayfasından çıkıldıysa kendini durdur
    if (!document.getElementById('cvArea')) { clearInterval(CV_TIK); CV_TIK = null; return; }
    if (document.hidden) return;   // 690 — sekme arka plandayken sunucuya gitme
    cvVeriCek().then(cvCiz).catch(()=>{});
  }, 60000);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !CV_TIK || !document.getElementById('cvArea')) return;
  if (CV_ZAMAN && Date.now() - CV_ZAMAN < 60000) return;
  cvVeriCek().then(cvCiz).catch(()=>{});
});

/* ═══════════════════════════════════════════════════════════════════
   REKLAM YÖNETİMİ
   Yuvalar: oyunun masaüstü görünümündeki sol ve sağ reklam alanları.
   Önerilen görsel: 300 × 600 px (dikey). GIF de olur, hareketli çalışır.
   ═══════════════════════════════════════════════════════════════════ */
/* Oyundaki altı reklam yuvası. Oyun sütununun solunda ve sağında
   alt alta üçer kutu var; her kutu bağımsız bir reklam gösterir.
   Ölçü: 160 × 200 px (1560 px'ten geniş ve 820 px'ten uzun
   ekranlarda 300 × 250 px). */
const RK_YUVALAR = [
  { k:'sol1', ad:'Sol · üst',  kisa:'SOL 1' },
  { k:'sol2', ad:'Sol · orta', kisa:'SOL 2' },
  { k:'sol3', ad:'Sol · alt',  kisa:'SOL 3' },
  { k:'sag1', ad:'Sağ · üst',  kisa:'SAĞ 1' },
  { k:'sag2', ad:'Sağ · orta', kisa:'SAĞ 2' },
  { k:'sag3', ad:'Sağ · alt',  kisa:'SAĞ 3' }
];
// Eski iki-yuvalı kayıtlar için etiket
function _rkYuvaAdi(k){
  if (k === 'sol') return 'SOL (eski)';
  if (k === 'sag') return 'SAĞ (eski)';
  const y = RK_YUVALAR.find(x => x.k === k);
  return y ? y.kisa : String(k || '—').toUpperCase();
}

let RK_LISTE = [];      // tüm reklam kayıtları
let RK_GUNLUK = {};     // ad_id -> [{gun, views, clicks}]
let RK_FIRMA = null;    // açık olan reklamveren (null = firma listesi)
let RK_DUZENLE = null;  // düzenlenen kayıt (null = yeni)

const RK_GUN = 86400000;
function _rkEsc(x){ return String(x==null?'':x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function _rkTarih(t){ if(!t) return '—'; const d=new Date(t); return isNaN(d)?'—':d.toLocaleDateString('tr',{day:'2-digit',month:'short',year:'numeric'}); }

// Durum + kalan süre sayacı
function _rkDurum(a){
  const now = Date.now();
  const bas = new Date(a.starts_at).getTime();
  const bit = new Date(a.ends_at).getTime();
  if (a.active === false) return { sinif:'rk-x', kisa:'DURDURULDU', sayac:'—', gecerli:false };
  if (now < bas){
    const g = Math.ceil((bas-now)/RK_GUN);
    return { sinif:'rk-b', kisa:'BEKLİYOR', sayac:g+' gün sonra başlıyor', gecerli:false };
  }
  if (now > bit) return { sinif:'rk-x', kisa:'SÜRESİ DOLDU', sayac:'bitti — '+_rkTarih(a.ends_at), gecerli:false };
  const kalan = bit - now;
  const gun = Math.floor(kalan/RK_GUN);
  const saat = Math.floor((kalan%RK_GUN)/3600000);
  return { sinif:'rk-y', kisa:'YAYINDA',
           sayac: (gun>0 ? gun+' gün ' : '') + saat + ' saat kaldı', gecerli:true };
}

async function _rkVeriCek(){
  const r = await api('list', { table:'ads', limit:1000 });
  RK_LISTE = (r.rows || []).slice().sort((a,b)=> new Date(b.created_at||0) - new Date(a.created_at||0));
  RK_GUNLUK = {};
  try {
    const g = await apiTum({ table:'ad_stats_daily', orderBy:'gun', orderDir:'desc' });
    (g.rows||[]).forEach(x => { (RK_GUNLUK[x.ad_id] = RK_GUNLUK[x.ad_id] || []).push(x); });
    Object.keys(RK_GUNLUK).forEach(k => RK_GUNLUK[k].sort((a,b)=> String(b.gun).localeCompare(String(a.gun))));
  } catch(e) { /* günlük kırılım yoksa sorun değil */ }
}

async function openAds(){
  _opTemizle();
  $('nav').querySelectorAll('.sub').forEach(b => b.classList.toggle('active', b.dataset.t === '__reklam__'));
  const act = $('nav').querySelector('.sub.active'); if (act) act.closest('.cat').classList.add('open');
  $('main').innerHTML = _opBaslik('Reklam Yönetimi','yükleniyor…') + '<div class="msg">Yükleniyor…</div>';
  try { await _rkVeriCek(); }
  catch(e){
    $('main').innerHTML = _opBaslik('Reklam Yönetimi','hata')
      + '<div class="opnot" style="border-color:rgba(226,59,90,.35);color:#ff8ea3">'
      + _rkEsc(e.message) + '<br><br>Tablo yeni oluşturulduysa <b>çıkış yapıp tekrar giriş yap</b> — '
      + 'panel tablo listesini girişte alıyor.</div>';
    return;
  }
  RK_FIRMA = null; RK_DUZENLE = null;
  rkCiz();
}

function rkCiz(){
  if (RK_DUZENLE !== null) return rkFormCiz();
  if (RK_FIRMA)            return rkFirmaCiz();

  const yayinda = RK_LISTE.filter(a => _rkDurum(a).gecerli);
  const toplamG = RK_LISTE.reduce((t,a)=>t+(Number(a.impressions)||0),0);
  const toplamT = RK_LISTE.reduce((t,a)=>t+(Number(a.clicks)||0),0);

  // Reklamverene göre grupla
  const firmalar = {};
  RK_LISTE.forEach(a => {
    const ad = (a.advertiser || '(isimsiz)').trim() || '(isimsiz)';
    const f = firmalar[ad] = firmalar[ad] || { ad, adet:0, yayinda:0, gorulme:0, tiklama:0 };
    f.adet++;
    if (_rkDurum(a).gecerli) f.yayinda++;
    f.gorulme += Number(a.impressions)||0;
    f.tiklama += Number(a.clicks)||0;
  });
  const liste = Object.values(firmalar).sort((a,b)=> b.gorulme - a.gorulme);

  const ctr = (t,g)=> g>0 ? ('%'+((t/g)*100).toFixed(1).replace('.',',')) : '—';

  $('main').innerHTML = _opBaslik('Reklam Yönetimi', RK_LISTE.length + ' reklam · ' + liste.length + ' reklamveren')
    + '<div class="rk-ozet fadein">'
      + _opKart('YAYINDA',        yayinda.length, RK_LISTE.length + ' kayıttan')
      + _opKart('TOPLAM GÖRÜLME', _fmtSayi(toplamG), 'gün başına tekil kişi')
      + _opKart('TOPLAM TIKLAMA', _fmtSayi(toplamT), ctr(toplamT,toplamG) + ' tıklama oranı', 's')
    + '</div>'
    + '<div style="display:flex;gap:8px;margin-bottom:14px">'
      + '<button class="btn green" onclick="rkYeni()">+ Yeni Reklam</button>'
      + '<button class="btn" onclick="openAds()">Yenile</button>'
    + '</div>'
    + (liste.length
        ? liste.map(f => `<div class="rk-firma" onclick="rkFirmaAc(${JSON.stringify(f.ad).replace(/"/g,'&quot;')})">
             <div class="rk-firma-o">
               <div class="rk-firma-ad">${_rkEsc(f.ad)}</div>
               <div class="rk-firma-alt">${f.adet} reklam · ${f.yayinda} yayında · tıklama oranı ${ctr(f.tiklama,f.gorulme)}</div>
             </div>
             <div class="rk-mini">
               <div><div class="v">${_fmtSayi(f.gorulme)}</div><div class="l">Gören</div></div>
               <div><div class="v" style="color:var(--gold)">${_fmtSayi(f.tiklama)}</div><div class="l">Tıklayan</div></div>
             </div>
           </div>`).join('')
        : '<div class="opnot">Henüz reklam yok. <b>+ Yeni Reklam</b> ile ekle.</div>')
    + '<div class="opnot">Reklamverenin adına dokun → o firmanın bütün reklamlarını, '
      + 'kaç kişinin gördüğünü, kaç kişinin tıkladığını ve gün gün dökümü gör.</div>';
}

function rkFirmaAc(ad){ RK_FIRMA = ad; rkCiz(); }
function rkGeri(){ RK_FIRMA = null; RK_DUZENLE = null; rkCiz(); }

function rkFirmaCiz(){
  const kayitlar = RK_LISTE.filter(a => ((a.advertiser||'(isimsiz)').trim()||'(isimsiz)') === RK_FIRMA);
  const g = kayitlar.reduce((t,a)=>t+(Number(a.impressions)||0),0);
  const t = kayitlar.reduce((x,a)=>x+(Number(a.clicks)||0),0);
  const ctr = g>0 ? ('%'+((t/g)*100).toFixed(1).replace('.',',')) : '—';

  $('main').innerHTML = _opBaslik(RK_FIRMA, kayitlar.length + ' reklam')
    + '<div style="display:flex;gap:8px;margin-bottom:14px">'
      + '<button class="btn" onclick="rkGeri()">‹ Reklamverenler</button>'
      + '<button class="btn green" onclick="rkYeni(' + JSON.stringify(RK_FIRMA).replace(/"/g,'&quot;') + ')">+ Bu firmaya reklam ekle</button>'
    + '</div>'
    + '<div class="rk-ozet fadein">'
      + _opKart('GÖREN KİŞİ',  _fmtSayi(g), 'gün başına tekil')
      + _opKart('TIKLAYAN',    _fmtSayi(t), ctr + ' tıklama oranı', 's')
      + _opKart('YAYINDA',     kayitlar.filter(a=>_rkDurum(a).gecerli).length, kayitlar.length + ' reklamdan')
    + '</div>'
    + kayitlar.map(a => rkKartHtml(a)).join('');
}

function rkKartHtml(a){
  const d = _rkDurum(a);
  const gor = Number(a.impressions)||0, tik = Number(a.clicks)||0;
  const ctr = gor>0 ? ('%'+((tik/gor)*100).toFixed(1).replace('.',',')) : '—';
  const gunler = RK_GUNLUK[a.id] || [];
  const gunTablo = gunler.length
    ? `<div class="rk-gunluk"><table>
         <tr><th>Gün</th><th>Gören</th><th>Tıklayan</th></tr>
         ${gunler.slice(0,60).map(x=>`<tr><td>${_rkEsc(x.gun)}</td><td>${_fmtSayi(x.views)}</td><td>${_fmtSayi(x.clicks)}</td></tr>`).join('')}
       </table></div>`
    : '';
  return `<div class="rk-kart">
    <img class="rk-gor" src="${_rkEsc(a.image_url)}" alt="" onerror="this.style.opacity='.25'">
    <div class="rk-gov">
      <div><span class="rk-rozet ${d.sinif}">${d.kisa}</span>
        <span class="rk-rozet" style="background:rgba(66,165,245,.16);color:var(--blue)">${_rkYuvaAdi(a.slot)}</span></div>
      <div class="rk-sayac">${_rkEsc(d.sayac)}</div>
      <div style="font-size:12px;color:var(--dim)">
        ${_rkTarih(a.starts_at)} → ${_rkTarih(a.ends_at)}<br>
        <a href="${_rkEsc(a.link_url)}" target="_blank" rel="noopener" style="color:var(--blue)">${_rkEsc(a.link_url)}</a>
        ${a.note ? '<br>' + _rkEsc(a.note) : ''}
      </div>
      <div class="rk-mini" style="justify-content:flex-start;text-align:left">
        <div><div class="v">${_fmtSayi(gor)}</div><div class="l">Gören</div></div>
        <div><div class="v" style="color:var(--gold)">${_fmtSayi(tik)}</div><div class="l">Tıklayan</div></div>
        <div><div class="v" style="color:var(--accent)">${ctr}</div><div class="l">Oran</div></div>
      </div>
      ${gunTablo}
      <div class="rk-btnsat">
        <button class="btn" onclick="rkDuzenle('${a.id}')">Düzenle</button>
        <button class="btn" onclick="rkDurdurBaslat('${a.id}', ${a.active ? 'false' : 'true'})">${a.active ? 'Durdur' : 'Yayına Al'}</button>
        <button class="btn" onclick="rkUzat('${a.id}')">Süre Uzat</button>
        <button class="btn red" onclick="rkSil('${a.id}')">Sil</button>
      </div>
    </div>
  </div>`;
}

// Görseli Supabase deposuna yükler, herkese açık adresini döndürür
async function _rkGorselYukle(file){
  const uz  = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g,'');
  const yol = 'r' + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + (uz||'png');
  const r = await fetch(CFG.url + '/storage/v1/object/reklam/' + yol, {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+TOKEN, 'apikey':CFG.anon,
              'Content-Type': file.type || 'application/octet-stream', 'x-upsert':'true' },
    body: file
  });
  if(!r.ok){
    const t = await r.text().catch(()=>'');
    throw new Error('Görsel yüklenemedi (' + r.status + '). ' + t.slice(0,180)
      + ' — reklam-kurulum.sql ADIM 2 ile kendini admin_users tablosuna eklediğinden emin ol.');
  }
  return CFG.url + '/storage/v1/object/public/reklam/' + yol;
}

async function rkKaydet(){
  const h = $('rkHata'), btn = $('rkKaydet');
  h.style.display = 'none';
  const hata = m => { h.textContent = m; h.style.display = ''; btn.disabled = false; btn.textContent = 'Tekrar Dene'; };
  btn.disabled = true; btn.textContent = 'Kaydediliyor…';

  const firma = $('rkFirma').value.trim();
  const link  = $('rkLink').value.trim();
  const basD  = $('rkBas').value;
  const bitD  = $('rkBit').value;
  let   gorsel= $('rkGorselUrl').value.trim();
  const dosya = $('rkDosya').files && $('rkDosya').files[0];

  if(!firma) return hata('Reklamveren adı boş olamaz.');
  if(!link)  return hata('Tıklama linki boş olamaz.');
  if(!/^https?:\/\//i.test(link)) return hata('Link http:// veya https:// ile başlamalı.');
  if(!basD || !bitD) return hata('Başlangıç ve bitiş tarihi gerekli.');
  if(new Date(bitD) <= new Date(basD)) return hata('Bitiş tarihi başlangıçtan sonra olmalı.');

  try {
    if(dosya) gorsel = await _rkGorselYukle(dosya);
    if(!gorsel) return hata('Görsel yükle ya da bir görsel adresi yapıştır.');

    const values = {
      slot:       $('rkSlot').value,
      advertiser: firma,
      image_url:  gorsel,
      link_url:   link,
      alt_text:   firma,
      starts_at:  new Date(basD + 'T00:00:00').toISOString(),
      ends_at:    new Date(bitD + 'T23:59:59').toISOString(),
      active:     $('rkAktif').value === '1',
      weight:     Math.max(1, Math.min(100, Number($('rkAgirlik').value) || 1)),
      note:       $('rkNot').value.trim() || null
    };

    if(RK_DUZENLE.yeni) await api('insert', { table:'ads', values });
    else                await api('update', { table:'ads', pk:{ id:RK_DUZENLE.id }, values });

    RK_DUZENLE = null;
    if(!RK_FIRMA) RK_FIRMA = firma;
    await _rkVeriCek();
    rkCiz();
  } catch(e){ hata(e.message || 'Kaydedilemedi.'); }
}

async function rkDurdurBaslat(id, yeni){
  try { await api('update', { table:'ads', pk:{ id }, values:{ active: yeni } });
        await _rkVeriCek(); rkCiz(); }
  catch(e){ alert('Olmadı: ' + e.message); }
}

async function rkUzat(id){
  const a = RK_LISTE.find(x=>x.id===id); if(!a) return;
  const g = prompt('Kaç gün uzatılsın?', '30');
  if(g === null) return;
  const gun = Number(g); if(!(gun > 0)) return alert('Geçerli bir gün sayısı gir.');
  const eskiBit = new Date(a.ends_at).getTime();
  const temel = Math.max(eskiBit, Date.now());
  try { await api('update', { table:'ads', pk:{ id },
          values:{ ends_at: new Date(temel + gun*RK_GUN).toISOString() } });
        await _rkVeriCek(); rkCiz(); }
  catch(e){ alert('Olmadı: ' + e.message); }
}

async function rkSil(id){
  const a = RK_LISTE.find(x=>x.id===id);
  if(!confirm('Bu reklam silinsin mi?\n\n' + ((a&&a.advertiser)||'') + '\nİstatistikleri de gider.')) return;
  try { await api('delete', { table:'ads', pk:{ id } });
        await _rkVeriCek();
        if(RK_FIRMA && !RK_LISTE.some(x => ((x.advertiser||'(isimsiz)').trim()||'(isimsiz)') === RK_FIRMA)) RK_FIRMA = null;
        rkCiz(); }
  catch(e){ alert('Silinemedi: ' + e.message); }
}

async function openTable(t) {
  SG_SIKAYET = null;   // 734
  CUR=t; STATE={ offset:0, limit:50, search:'', searchCol:'' }; GRID_BACK=null;
  $('dashBtn').classList.remove('active');
  $('nav').querySelectorAll('.sub').forEach(b => b.classList.toggle('active', b.dataset.t===t));
  const act = $('nav').querySelector('.sub.active');
  if (act) act.closest('.cat').classList.add('open');
  document.body.classList.remove('navopen');
  await loadRows();
}
async function loadRows() {
  $('main').innerHTML='<div class="msg">Yükleniyor…</div>';
  try {
    const sosyal = CUR === 'social_posts';   // 734 — gönderiler en yeniden eskiye
    const d = await api('list', { table:CUR, limit:STATE.limit, offset:STATE.offset,
      search:STATE.search||undefined, searchCol:STATE.searchCol||undefined,
      orderBy: sosyal ? 'ts' : undefined, orderDir: sosyal ? 'desc' : undefined });
    if (sosyal) {
      let tepki = [];
      try { tepki = (await apiTum({ table:'social_likes', cols:'post_id,reaction', sayim:'yok' })).rows || []; } catch(e) {}
      renderSosyal(d.rows||[], d.count||0, tepki);
    }
    else if (STRIP[CUR]) renderStrip(d.rows||[], d.count||0);
    else renderGrid(d.rows||[], d.count||0);
  } catch(e) { $('main').innerHTML = `<div class="msg err">${e.message}</div>`; }
}
const fmtCell = (v) => (v===null||v===undefined) ? '' : (typeof v==='object' ? JSON.stringify(v) : String(v));

function renderGrid(rows, count) {
  const cols = (META[CUR].columns||[]).map(c=>c.name);
  const textCols = (META[CUR].columns||[]).filter(c=>['text','character varying','uuid'].includes(c.type)).map(c=>c.name);
  if (!STATE.searchCol && textCols.length) STATE.searchCol = textCols[0];

  const head = `
    <div class="titlebox fadein">
      <button class="backbtn" id="backBtn">‹ Geri</button>
      <h2>${tableLabel(CUR)}</h2>
      <span class="cnt">${count} kayıt</span>
      <div class="sp"></div>
      <select id="scol">${textCols.map(c=>`<option value="${c}" ${c===STATE.searchCol?'selected':''}>${colLabel(c)}</option>`).join('')}</select>
      <input id="sval" placeholder="ara…" value="${STATE.search.replace(/"/g,'&quot;')}">
      <button class="btn gold" id="sbtn">Ara</button>
      <button class="btn green" id="addBtn">+ Ekle</button>
    </div>`;

  const table = `
    <div class="tablewrap fadein"><div class="scroll">
    <table>
      <thead><tr>${cols.map(c=>`<th title="${c}">${colLabel(c)}</th>`).join('')}<th>İşlem</th></tr></thead>
      <tbody>
        ${rows.map((row,i)=>`<tr>
          ${cols.map(c=>`<td title="${fmtCell(row[c]).replace(/"/g,'&quot;')}">${fmtCell(row[c])}</td>`).join('')}
          <td class="act"><button class="mini" data-edit="${i}">Düzenle</button><button class="mini red" data-del="${i}">Sil</button></td>
        </tr>`).join('')}
      </tbody>
    </table></div></div>`;

  const totalPages = Math.max(1, Math.ceil(count/STATE.limit));
  const curPage = Math.floor(STATE.offset/STATE.limit)+1;
  const page = `
    <div class="page">
      <button class="btn" id="prev" ${STATE.offset<=0?'disabled':''}>‹ Önceki</button>
      <span class="cnt">${curPage} / ${totalPages}</span>
      <button class="btn" id="next" ${curPage>=totalPages?'disabled':''}>Sonraki ›</button>
    </div>`;

  $('main').innerHTML = head + table + (rows.length ? page : '<div class="msg">Kayıt yok.</div>');

  $('sbtn').onclick = () => { STATE.search=$('sval').value.trim(); STATE.searchCol=$('scol').value; STATE.offset=0; loadRows(); };
  $('sval').addEventListener('keydown', e => { if (e.key==='Enter') $('sbtn').click(); });
  $('addBtn').onclick = () => openEditor('add', {});
  const bk=$('backBtn'); if(bk) bk.onclick = GRID_BACK || openDash;
  const prev=$('prev'), next=$('next');
  if (prev) prev.onclick = () => { STATE.offset=Math.max(0,STATE.offset-STATE.limit); loadRows(); };
  if (next) next.onclick = () => { STATE.offset+=STATE.limit; loadRows(); };
  $('main').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEditor('edit', rows[+b.dataset.edit]));
  $('main').querySelectorAll('[data-del]').forEach(b => b.onclick = () => delRow(rows[+b.dataset.del]));
}


/* ═══════════════════════════════════════════════════════════════
   🆕 KOMPAKT ŞERİT GÖRÜNÜMÜ (tasarım B)
   Ham tablo yerine tek satırlık, kaydırmasız liste.
   Düzenle/Sil/Ekle işlevleri korunur — yalnızca görünüm değişir.
   Yapılandırması olmayan tablolar eski grid ile açılır.
   ═══════════════════════════════════════════════════════════════ */
const _sEsc = (v) => String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const _sKisa = (v,n) => { const t=String(v==null?'':v); return t.length>n ? t.slice(0,n-1)+'…' : t; };
const _sTarih = (v) => { if(!v) return ''; try{ const d=new Date(v);
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+' '
       + String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }catch(e){ return ''; } };
const _sPara = (v) => { const n=Number(v)||0;
  if (Math.abs(n)>=1e6) return (n/1e6).toFixed(1).replace('.',',')+'M';
  if (Math.abs(n)>=1e3) return Math.round(n/1e3)+'K'; return String(Math.round(n)); };

/* tablo → satır yapılandırması
   nokta: 'y'|'k'|'p'  · sol/orta/sag/lig alanları HTML döndürür */
const STRIP = {
  match_state: {
    grup: r => r.kickoff_at ? String(r.kickoff_at).slice(0,10) : '—',
    nokta: r => r.status==='running' ? 'k' : (r.status==='finished' ? 'y' : 'p'),
    saat: r => r.kickoff_at ? String(r.kickoff_at).slice(11,16) : '—',
    sol:  r => r.home_team, sag: r => r.away_team,
    skor: r => r.status==='scheduled' ? 'VS' : ((r.home_score??0)+'-'+(r.away_score??0)),
    not:  r => (r.tournament_key ? (_TRN_ETIKET[r.tournament_key]||r.tournament_key) : (r.league_name||'Lig'))
             + (r.status==='running' ? ' · '+(r.sim_minute||0)+"'" : ''),
    sonuk: r => r.status==='scheduled'
  },
  match_results: {
    grup: r => r.created_at ? String(r.created_at).slice(0,10) : '—',
    nokta: () => 'y',
    saat: r => _sTarih(r.created_at).slice(6) || '—',
    sol: r => r.home_team, sag: r => r.away_team,
    skor: r => (r.home_score??0)+'-'+(r.away_score??0),
    not: r => (r.tournament_key ? (_TRN_ETIKET[r.tournament_key]||r.tournament_key) : (r.league_name||'Lig'))
  },
  user_inbox:   { nokta:()=> 'p', saat:r=>_sTarih(r.updated_at),
                  sol:r=>_sKisa(r.user_id,10), sag:r=>'',
                  skor:r=>String((Array.isArray(r.messages)?r.messages.length:0)),
                  not:()=>'mesaj' },
  social_posts: { nokta:()=> 'y', saat:r=>_sTarih(r.created_at),
                  sol:r=>_sKisa(r.author_id||r.user_id,10),
                  sag:r=>_sKisa(r.body||r.text||r.content,42), skor:r=>String(r.likes??0), not:()=>'beğeni' },
  social_likes: { nokta:()=> 'y', saat:r=>_sTarih(r.created_at),
                  sol:r=>_sKisa(r.user_id,10), sag:r=>_sKisa(r.post_id,14), skor:()=>'♥', not:()=>'' },
  social_follows:{nokta:()=> 'y', saat:r=>_sTarih(r.created_at),
                  sol:r=>_sKisa(r.follower_id,10), sag:r=>_sKisa(r.following_id,10), skor:()=>'→', not:()=>'takip' },
  transfer_listings: { nokta:r=>r.sold_at?'p':'y', saat:r=>_sTarih(r.created_at),
                  sol:r=>r.player_name||_sKisa(r.player_id,10), sag:r=>r.seller_team||r.team_name||'',
                  skor:r=>_sPara(r.price||r.fee), not:r=>r.sold_at?'satıldı':'ilanda' },
  player_transfer_listings: { nokta:r=>r.sold_at?'p':'y', saat:r=>_sTarih(r.created_at),
                  sol:r=>r.player_name||_sKisa(r.player_id,10), sag:r=>r.team_name||'',
                  skor:r=>_sPara(r.price), not:r=>r.sold_at?'satıldı':'ilanda' },
  item_listings:{ nokta:r=>r.sold_at?'p':'y', saat:r=>_sTarih(r.created_at),
                  sol:r=>r.item_name||_sKisa(r.item_id,12), sag:r=>_sKisa(r.seller_user_id,10),
                  skor:r=>_sPara(r.price), not:r=>r.sold_at?'satıldı':'ilanda' },
  shop_stocks:  { nokta:()=> 'y', saat:()=>'',

const SG_TUR = { 'tpl-player': ['Takım Arıyorum', 'oy'], 'tpl-team': ['Futbolcu Arıyorum', 'tk'] };

  if (cc === 'SC') return '\u{1F3F4}\u{E0067}\u{E0062}\u{E0073}\u{E0063}\u{E0074}\u{E007F}';
  return /^[A-Z]{2}$/.test(cc) ? String.fromCodePoint(...[...cc].map(c => 0x1F1E6 + c.charCodeAt(0) - 65)) : '';

const _sgGun = (ms) => {

function pkObj(row, tbl) {
  const pk = META[tbl||CUR].pk||[]; const o={};
  (pk.length ? pk : Object.keys(row)).forEach(k => { if (k in row) o[k]=row[k]; });
  return o;
}

function openEditor(mode, row, tbl, after) {
  const T = tbl || CUR;
  EDIT={ table:T, mode, row, after:after||null };
  const pk = META[T].pk||[], cols = META[T].columns||[];
  $('modalTitle').innerHTML = (mode==='add'?'Yeni kayıt — ':'Düzenle — ') + `<span>${tableLabel(T)}</span>`;
  $('modalErr').textContent='';
  $('modalFields').innerHTML = cols.map(c => {
    const isPk = pk.includes(c.name);
    const ro = (mode==='edit' && isPk) ? 'readonly' : '';
    let val = (c.name in row) ? row[c.name] : null;
    const isJson = (c.type==='jsonb' || c.type==='json');
    const dv = (val===null||val===undefined) ? '' : (typeof val==='object' ? JSON.stringify(val,null,2) : String(val));
    const field = isJson
      ? `<textarea data-c="${c.name}" ${ro}>${dv.replace(/</g,'&lt;')}</textarea>`
      : `<input data-c="${c.name}" value="${dv.replace(/"/g,'&quot;')}" ${ro}>`;
    return `<div class="fld"><label>${colLabel(c.name)} <span class="ty">${c.name} · ${c.type}${isPk?' · PK':''}</span></label>${field}</div>`;
  }).join('');
  $('modal').style.display='flex';
}

function coerce(type, raw) {
  if (raw==='') return null;
  if (type==='jsonb'||type==='json') return JSON.parse(raw);
  if (type==='boolean') return raw==='true'||raw===true;
  if (['integer','bigint','smallint','numeric','double precision','real'].includes(type)) return Number(raw);
  return raw;
}

async function saveEditor() {
  $('modalErr').textContent='';
  const cols = META[EDIT.table].columns||[], pk = META[EDIT.table].pk||[], values={};
  try {
    $('modalFields').querySelectorAll('[data-c]').forEach(el => {
      const name=el.dataset.c, type=(cols.find(c=>c.name===name)||{}).type||'text';
      if (EDIT.mode==='edit' && pk.includes(name)) return;
      values[name]=coerce(type, el.value);
    });
  } catch(e) { $('modalErr').textContent='JSON hatası: '+e.message; return; }
  try {
    if (EDIT.mode==='add') await api('insert', { table:EDIT.table, values });
    else await api('update', { table:EDIT.table, pk:pkObj(EDIT.row, EDIT.table), values });
    $('modal').style.display='none'; if (EDIT.after) EDIT.after(); else loadRows();
  } catch(e) { $('modalErr').textContent = e.message; }
}

async function delRow(row) {
  if (!confirm('Bu kaydı silmek istediğine emin misin? Geri alınamaz.')) return;
  try { await api('delete', { table:CUR, pk:pkObj(row) }); loadRows(); }
  catch(e) { alert('Silinemedi: '+e.message); }
}

function uTumYukle(){
  if(_uTumYuk) return _uTumYuk;
  _uTumYuk=Promise.all([
    apiTum({ table:'profiles', orderBy:'id', orderDir:'asc' }),
    apiTum({ table:'players', orderBy:'user_id', orderDir:'asc' }, _gercekBitti).catch(()=>({rows:[]}))
  ]).then(([pf,pl])=>{
    UDATA.all=pf.rows||[];
    (pl.rows||[]).forEach(x=>{ if(x.user_id!=null) UDATA.plMap[x.user_id]=x; });
    UDATA.tum=true;
  }).finally(()=>{ _uTumYuk=null; });
  return _uTumYuk;
}
function uPlayerBits(pl, up){
  if(!pl && !up) return null;
  pl=pl||{}; up=up||{}; const pj=up.player||{};
  const ovr = (pl.overall!=null)?pl.overall:((up.overall!=null)?up.overall:((pj.overall!=null)?pj.overall:'–'));
  const pos = pl.pos||up.position||pj.pos||pj.position||'';
  const num = (up.num!=null)?up.num:((pj.num!=null)?pj.num:'');
  const name = pj.name||up.name||'';
  const level = (pl.level!=null)?pl.level:((up.level!=null)?up.level:'–');
  const xp = (pl.xp!=null)?pl.xp:((up.xp!=null)?up.xp:null);
  const sk = up.skills||up.abilities||pj.abilities||pj.skills;
  const grp = _pmGroupOf(pos||'MID'), kat = SKILL_DEFS.find(c=>c.g===grp);
  const gs = (sk&&typeof sk==='object'&&sk[grp]&&typeof sk[grp]==='object')?sk[grp]:null;
  const aCount = (gs&&kat)?Math.round(kat.skills.reduce((t,x)=>{ const e=gs[x.id]; return t+(Number((e&&typeof e==='object')?e.level:e)||10); },0)/kat.skills.length):'–';
  const eq = up.equipment||{};
  const eqCount = Array.isArray(eq.wardrobe)?eq.wardrobe.length:0;
  const tro = up.trophies; const tCount=Array.isArray(tro)?tro.length:0;
  return { ovr, pos, num, name, level, xp, aCount, eqCount, tCount };
}

// 780 — Uyruklar dönemi: bugün (varsayılan) · bu ay · tüm zamanlar · özel tarih (Türkiye saatine göre gün)
const UDON={ k:'bugun', bas:null, bit:null };
const _uGunFmt=new Intl.DateTimeFormat('en-CA',{ timeZone:'Europe/Istanbul', year:'numeric', month:'2-digit', day:'2-digit' });
function uIstGun(ms){ return _uGunFmt.format(new Date(ms==null?Date.now():ms)); }
function uDonAra(k){
  const bugun=uIstGun();
  if(k==='bugun') return [bugun,bugun];
  if(k==='ay') return [bugun.slice(0,8)+'01',bugun];
  if(k==='ozel'){
    if(!UDON.bas){ UDON.bas=uIstGun(Date.now()-6*86400000); UDON.bit=bugun; }
    return UDON.bas<=UDON.bit?[UDON.bas,UDON.bit]:[UDON.bit,UDON.bas];
  }
  return null;
}
// Günlük sayım en yeni günden geriye okunur; istenen ilk güne varınca durur (daha önce okunan yeterliyse istek yok)
let _uGunYuk=null;
function uGunYukle(bas){
  const G=UDATA.gun;
  if(G && (G.tam || G.bas<=bas)) return Promise.resolve(G);
  if(_uGunYuk) return _uGunYuk.then(()=>uGunYukle(bas));
  _uGunYuk=apiTum({ table:'admin_uyruk_gun', orderBy:'k', orderDir:'desc', sayim:'yok' }, rows=>rows.some(x=>x.gun<bas))
    .then(r=>{ UDATA.gun={ rows:r.rows, bas, tam:!r.rows.some(x=>x.gun<bas) }; return UDATA.gun; })
    .finally(()=>{ _uGunYuk=null; });
  return _uGunYuk;
}
function uDonSay(k){   // [{cc,n}] · null: henüz okunmadı
  if(k==='tum') return UDATA.uyruk||[];
  const G=UDATA.gun, a=uDonAra(k); if(!G || G.bas>a[0] && !G.tam) return null;
  const say={}; G.rows.forEach(x=>{ if(x.gun>=a[0] && x.gun<=a[1]) say[x.cc]=(say[x.cc]||0)+(Number(x.n)||0); });
  return Object.keys(say).map(cc=>({ cc, n:say[cc] }));
}
function uDonCiz(){
  const el=$('uDon'); if(!el) return;
  const top=k=>{ const L=uDonSay(k); return L?L.reduce((t,x)=>t+x.n,0):'…'; };
  const D=[['bugun','Bugün'],['ay','Bu ay'],['tum','Tüm zamanlar'],['ozel','Özel tarih']];
  const a=UDON.k==='ozel'?uDonAra('ozel'):null;
  el.innerHTML=`<div class="ak-cips">${D.map(([k,ad])=>`<button class="ak-cip u-sar${UDON.k===k?' on':''}" data-d="${k}"><em>${top(k)}</em><span>${ad}</span></button>`).join('')}</div>`
    + (a?`<div class="u-don-t"><input type="date" class="bcinp" id="uDonBas" value="${a[0]}" max="${uIstGun()}"><input type="date" class="bcinp" id="uDonBit" value="${a[1]}" max="${uIstGun()}"></div>`:'');
  el.querySelectorAll('.ak-cip[data-d]').forEach(b=>b.onclick=()=>{ UDON.k=b.dataset.d; uDonYenile(); });
  const db=$('uDonBas'), dt=$('uDonBit');
  if(db) db.onchange=()=>{ if(db.value){ UDON.bas=db.value; uDonYenile(); } };
  if(dt) dt.onchange=()=>{ if(dt.value){ UDON.bit=dt.value; uDonYenile(); } };
}
function uDonYenile(){
  uDonCiz(); uUyrukCiz();
  const ay=uDonAra('ay')[0], oz=UDON.k==='ozel'?uDonAra('ozel')[0]:ay;
  const bas=oz<ay?oz:ay;
  if(UDATA.gun && (UDATA.gun.tam || UDATA.gun.bas<=bas)) return;
  uGunYukle(bas).then(()=>{ if(USTATE.sekme==='uyruk' && CUR==='__users__'){ uDonCiz(); uUyrukCiz(); } })
    .catch(e=>{ const rk=$('uRk'); if(rk && USTATE.sekme==='uyruk') rk.innerHTML='<div class="msg err">'+uEsc(e.message)+'</div>'; });
}
// Uyruk özeti (32 ülke / harici) + uyruk sıralaması — tüm zamanlar; Uyruklar'da yanında seçilen dönemin kaydı (+12)
function uUyrukCiz(){
  const oz=$('uOz'), rk=$('uRk'); if(!oz||!rk) return;
  const say={}; let oyun=0, top=0;
  (UDATA.uyruk||[]).forEach(x=>{ const n=Number(x.n)||0, cc=String(x.cc||'').toUpperCase(); top+=n; if(!cc) return; say[cc]=(say[cc]||0)+n; if(OYUN_CC.has(cc)) oyun+=n; });
  const don=USTATE.sekme==='uyruk' && UDON.k!=='tum', ek=don?uDonSay(UDON.k):null;
  const art={}; let aOyun=0, aTop=0;
  (ek||[]).forEach(x=>{ const n=Number(x.n)||0, cc=String(x.cc||'').toUpperCase(); aTop+=n; if(!cc) return; art[cc]=(art[cc]||0)+n; if(OYUN_CC.has(cc)) aOyun+=n; });
  const ar=n=>don?`<span class="u-ar">${ek?(n?'+'+n:''):'…'}</span>`:'';
  const haric=top-oyun, yuz=n=>top?Math.round(n/top*100):0;
  const satir=(cls,ad,n,a)=>`<div class="s ${cls}"><div class="l"><i></i>${ad}</div><div class="n">${n}</div>${ar(a)}<div class="p">%${yuz(n)}</div><div class="bar"><b style="width:${yuz(n)}%"></b></div></div>`;
  oz.classList.toggle('art',don); rk.classList.toggle('art',don);
  oz.innerHTML=satir('u-yes','32 ülke uyruklu',oyun,aOyun)+satir('u-mav','Harici uyruk',haric,aTop-aOyun);
  const L=Object.keys(say).map(cc=>({ cc, n:say[cc], ad:CC_NAME[cc]||cc })).sort((a,b)=>b.n-a.n||a.ad.localeCompare(b.ad,'tr'));
  const max=L.length?L[0].n:1;
  rk.innerHTML=L.length?L.map((x,i)=>`<div class="r ${OYUN_CC.has(x.cc)?'u-yes':'u-mav'}"><span class="rk${i<3?' g'+(i+1):''}">${i+1}</span><span class="bay">${ccFlag(x.cc)}</span><span class="ad">${uEsc(x.ad)}<small>${uEsc(x.cc)}</small></span><span class="cb"><b style="width:${Math.max(4,x.n/max*100)}%"></b></span><span class="say">${x.n}</span>${ar(art[x.cc]||0)}</div>`).join('')
    :'<div class="msg">Kayıt yok.</div>';
}
function uSekme(t){
  USTATE.sekme=t;
  const sek=$('uSek'); if(!sek) return;
  sek.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s===t));
  $('uList').style.display=$('uPage').style.display=(t==='liste')?'':'none';
  $('uRk').style.display=(t==='uyruk')?'':'none';
  $('uOz').style.display=(t==='liste'||t==='uyruk')?'':'none';
  $('uDon').style.display=(t==='uyruk')?'':'none';
  if(t==='uyruk') uDonYenile(); else if(t==='liste') uUyrukCiz();
  const ek=$('uEk'); ek.style.display=(t==='kaptan'||t==='aktif'||t==='silinen'||t==='engel')?'':'none';
  if((t==='kaptan'||t==='aktif'||t==='engel') && !UDATA.tum){
    ek.innerHTML='<div class="msg">Yükleniyor…</div>';
    uTumYukle().then(()=>{ if(USTATE.sekme===t && CUR==='__users__') uSekme(t); }).catch(e=>{ if(USTATE.sekme===t) ek.innerHTML='<div class="msg err">'+uEsc(e.message)+'</div>'; });
    return;
  }
  if(t==='kaptan') uKaptanCiz(); else if(t==='aktif') uAktifCiz(); else if(t==='silinen') uSilinenCiz(); else if(t==='engel') uEngelCiz();
}
