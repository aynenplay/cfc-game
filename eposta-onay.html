<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05070a">
<title>City Soccer Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#05070a;color:#e8eaf0;font-family:'Barlow',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  background-image:radial-gradient(ellipse at 50% 0%,rgba(70,209,122,.10),transparent 60%),repeating-linear-gradient(45deg,#080a0e 0 2px,#05070a 2px 4px)}
main{width:100%;max-width:400px;text-align:center}
.logo{display:block;width:min(240px,64vw);aspect-ratio:1020/336;margin:0 auto 34px;object-fit:contain}
.ik{width:76px;height:76px;margin:0 auto 20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(70,209,122,.12);border:1.5px solid rgba(70,209,122,.55);color:#46d17a;box-shadow:0 0 34px rgba(70,209,122,.18)}
.ik svg{width:38px;height:38px}
.hata .ik{background:rgba(255,138,101,.1);border-color:rgba(255,138,101,.5);color:#ff8a65;box-shadow:0 0 34px rgba(255,138,101,.14)}
h1{font:900 30px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.3px}
.ep{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid #20242c;
  font-size:15px;font-weight:600;color:#c9cdd8;word-break:break-all}
.ep:empty{display:none}
p{margin-top:14px;font-size:15px;line-height:1.45;color:#8b90a0}
p:empty{display:none}
.bt{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;margin-top:30px;border-radius:14px;
  background:linear-gradient(180deg,#4fdc84,#36b866);color:#05140b;text-decoration:none;font:800 19px/1 'Barlow Condensed',sans-serif;letter-spacing:.6px}
.bt svg{width:20px;height:20px}
.bt[hidden]{display:none}
</style>
</head>
<body>
<main id="kutu">
  <img class="logo" src="/medya/acilis-csc26.0197261c.webp" alt="CSC26">
  <div class="ik" id="ik"></div>
  <h1 id="baslik"></h1>
  <div class="ep" id="ep"></div>
  <p id="alt"></p>
  <a class="bt" id="bt" hidden></a>
</main>
<script>
/* 890 — e-posta değişikliği onay sayfası: oyun tarayıcıda açılmaz, sonuç gösterilir, Android'de uygulamaya dönülür */
(function () {
  var M = {
    tr: ['E-posta adresin güncellendi', 'Uygulamaya Dön', 'Uygulamaya geri dönebilirsin.', 'Bağlantı geçersiz', 'Süresi dolmuş ya da daha önce kullanılmış. Oyundan yeniden dene.'],
    en: ['Your e-mail address has been updated', 'Back to the App', 'You can go back to the app now.', 'Invalid link', 'It has expired or was already used. Try again from the game.'],
    de: ['Deine E-Mail-Adresse wurde aktualisiert', 'Zurück zur App', 'Du kannst jetzt zur App zurückkehren.', 'Ungültiger Link', 'Er ist abgelaufen oder wurde bereits verwendet. Versuche es im Spiel erneut.'],
    es: ['Tu correo electrónico se ha actualizado', 'Volver a la app', 'Ya puedes volver a la app.', 'Enlace no válido', 'Ha caducado o ya se usó. Inténtalo de nuevo desde el juego.'],
    pt: ['Seu e-mail foi atualizado', 'Voltar ao app', 'Você já pode voltar ao app.', 'Link inválido', 'Ele expirou ou já foi usado. Tente de novo pelo jogo.'],
    it: ['Il tuo indirizzo email è stato aggiornato', "Torna all'app", "Ora puoi tornare all'app.", 'Link non valido', 'È scaduto o è già stato usato. Riprova dal gioco.'],
    fr: ['Ton adresse e-mail a été mise à jour', "Retour à l'appli", "Tu peux revenir dans l'appli.", 'Lien invalide', 'Il a expiré ou a déjà été utilisé. Réessaie depuis le jeu.'],
    ru: ['Твой адрес эл. почты обновлён', 'Вернуться в приложение', 'Можно вернуться в приложение.', 'Ссылка недействительна', 'Срок её действия истёк или она уже использована. Попробуй снова в игре.']
  };
  var q = location.search, h = location.hash.replace(/^#/, '');
  var dil = ((/[?&]dil=([a-z]{2})/.exec(q) || [])[1] || (navigator.language || 'tr').slice(0, 2)).toLowerCase();
  var t = M[dil] || M.en;
  document.documentElement.lang = M[dil] ? dil : 'en';
  var p = {}; h.split('&').forEach(function (x) { var i = x.indexOf('='); if (i > 0) { try { p[x.slice(0, i)] = decodeURIComponent(x.slice(i + 1).replace(/\+/g, ' ')); } catch (e) {} } });
  if (/[?&]error/.test(q) && !p.error) q.slice(1).split('&').forEach(function (x) { var i = x.indexOf('='); if (i > 0) p[x.slice(0, i)] = x.slice(i + 1); });
  // Bağlantıdaki oturum anahtarları bu sayfada kullanılmaz; adres çubuğundan da silinir
  try { history.replaceState(null, '', location.pathname + (q.replace(/[?&](error|error_code|error_description)=[^&]*/g, '') || '')); } catch (e) {}
  var hata = !!(p.error || p.error_code || p.error_description);
  var eposta = '';
  if (!hata && p.access_token) {
    try { var b = p.access_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); eposta = JSON.parse(decodeURIComponent(escape(atob(b)))).email || ''; } catch (e) {}
  }
  var $ = function (id) { return document.getElementById(id); };
  var ONAY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var UYARI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5"/><path d="M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>';
  var OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  if (hata) {
    $('kutu').className = 'hata'; $('ik').innerHTML = UYARI; $('baslik').textContent = t[3]; $('alt').textContent = t[4];
  } else {
    $('ik').innerHTML = ONAY; $('baslik').textContent = t[0]; $('ep').textContent = eposta;
    if (/Android/i.test(navigator.userAgent)) {
      var play = 'https://play.google.com/store/apps/details?id=club.citysoccer.app';
      var bt = $('bt'); bt.innerHTML = '<span></span>' + OK; bt.firstChild.textContent = t[1];
      bt.href = 'intent://citysoccer.club/#Intent;scheme=https;package=club.citysoccer.app;S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
      bt.hidden = false;
    } else {
      $('alt').textContent = t[2];
    }
  }
  document.title = (hata ? t[3] : t[0]) + ' · City Soccer Club';
})();
</script>
</body>
</html>
